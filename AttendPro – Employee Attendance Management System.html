<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23e0685d%27/%3E%3Crect x=%277%27 y=%279%27 width=%2718%27 height=%2716%27 rx=%272%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3Cpath d=%27M7 14h18M12 6v5M20 6v5%27 stroke=%27white%27 stroke-width=%272.2%27/%3E%3C/svg%3E">
<title>AttendPro – Employee Attendance Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ====================== Design tokens ====================== */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --border: #e5e9f2;
  --text: #0f172a;
  --text-2: #475569;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-600: #1d4ed8;
  --primary-50: #eff6ff;
  --sidebar: #0f172a;
  --sidebar-2: #1e293b;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --sky: #0284c7;
  --indigo: #4f46e5;
  --violet: #7c3aed;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.2);
  --sidebar-w: 256px;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
a { color: var(--primary); text-decoration: none; }
button { font-family: inherit; }
input, select, textarea {
  font: inherit;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
input:disabled, select:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
textarea { resize: vertical; width: 100%; }

.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; }
.right { text-align: right; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.wrap { max-width: 260px; white-space: normal; }
.link { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }

/* ====================== Layout ====================== */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, var(--sidebar) 0%, #111c33 100%);
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 40;
  transition: transform 0.25s ease;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 22px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: #fff;
  box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
}
.brand-name { font-weight: 700; font-size: 17px; color: #fff; }
.brand-sub { font-size: 12px; color: #94a3b8; }
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-section {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: #64748b; padding: 10px 12px 8px;
}
.nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 9px;
  color: #cbd5e1;
  font-weight: 500;
  background: none; border: 0; cursor: pointer; text-align: left; font-size: 14px;
  transition: background 0.15s, color 0.15s;
}
.nav-link:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
.nav-link.active { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
.nav-link.logout { margin-top: 8px; color: #fca5a5; }
.nav-link.logout:hover { background: rgba(239, 68, 68, 0.12); }

.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 64px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 28px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar-title { font-weight: 600; color: var(--text-2); flex: 1; }
.topbar-user { display: flex; align-items: center; gap: 12px; }
.topbar-user-text { text-align: right; }
.topbar-user-name { font-weight: 600; }
.topbar-user-role { font-size: 12px; color: var(--muted); }
.content { padding: 28px; max-width: 1440px; width: 100%; }
.mobile-only { display: none; }
.sidebar-backdrop { display: none; }

.page-header {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  margin-bottom: 22px;
}
.page-header h1 { font-size: 24px; font-weight: 700; }
.page-header p { margin: 4px 0 0; color: var(--muted); }
.page-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 14px; }
.section-head h2 { font-size: 18px; }

/* ====================== Cards & grids ====================== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.card-head h3 { font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.grid-2 > .card, .grid-2-1 > .card { margin-bottom: 0; }
.grid-2, .grid-2-1 { margin-bottom: 20px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex; gap: 14px; align-items: center;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
.stat-icon { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; }
.stat-label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.stat-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.tone-blue { background: #dbeafe; color: #1d4ed8; }
.tone-green { background: #dcfce7; color: #15803d; }
.tone-amber { background: #fef3c7; color: #b45309; }
.tone-red { background: #fee2e2; color: #b91c1c; }
.tone-sky { background: #e0f2fe; color: #0369a1; }
.tone-slate { background: #f1f5f9; color: #334155; }
.tone-indigo { background: #e0e7ff; color: #4338ca; }
.tone-violet { background: #ede9fe; color: #6d28d9; }

/* ====================== Buttons ====================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px;
  border-radius: 9px;
  border: 1px solid transparent;
  font-weight: 600; font-size: 14px;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s, transform 0.05s, opacity 0.15s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3); }
.btn-primary:hover:not(:disabled) { background: var(--primary-600); }
.btn-ghost { background: #fff; color: var(--text); border-color: var(--border); }
.btn-ghost:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover:not(:disabled) { background: #15803d; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #b91c1c; }
.btn-danger-ghost { background: #fff; color: var(--red); border-color: #fecaca; }
.btn-danger-ghost:hover:not(:disabled) { background: #fef2f2; }
.btn-sm { padding: 6px 11px; font-size: 13px; }
.btn-lg { padding: 13px 26px; font-size: 15px; }
.btn-block { width: 100%; }

.icon-btn {
  width: 34px; height: 34px;
  display: inline-grid; place-items: center;
  border-radius: 8px;
  border: 0; background: transparent; color: var(--text-2);
  cursor: pointer;
}
.icon-btn:hover:not(:disabled) { background: #f1f5f9; color: var(--text); }
.icon-btn.danger:hover { background: #fef2f2; color: var(--red); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.spin { animation: spin 0.8s linear infinite; }

/* ====================== Forms ====================== */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--text-2); }
.field.compact { margin-bottom: 0; min-width: 160px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.span-2 { grid-column: span 2; }
.input-icon { position: relative; display: flex; align-items: center; }
.input-icon > svg { position: absolute; left: 12px; color: #94a3b8; pointer-events: none; }
.input-icon input { width: 100%; padding-left: 38px; }
.input-action {
  position: absolute; right: 8px;
  background: none; border: 0; color: #94a3b8; cursor: pointer; display: grid; place-items: center;
}
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar.wrap-row { align-items: flex-end; margin: 16px 0 0; }
.grow { flex: 1; min-width: 220px; }
.align-end { align-self: flex-end; }

/* ====================== Tables ====================== */
.table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left;
  font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted);
  padding: 10px 12px;
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.table th.right, .table th.num { text-align: right; }
.table td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.table tbody tr:hover { background: #fafbff; }
.table tbody tr:last-child td { border-bottom: 0; }
.row-dirty { background: #fffbeb !important; }
.register input[type='time'] { width: 120px; padding: 7px 9px; }
.register .remarks { width: 100%; min-width: 140px; padding: 7px 10px; }

.person { display: flex; align-items: center; gap: 10px; }
.person-name { font-weight: 600; }
.person-sub { font-size: 12px; color: var(--muted); }
.avatar {
  border-radius: 50%;
  display: inline-grid; place-items: center; flex-shrink: 0;
  background: linear-gradient(135deg, #dbeafe, #e0e7ff);
  color: #3730a3; font-weight: 700;
}

.pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 14px; }

/* ====================== Badges & pills ====================== */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; text-transform: capitalize;
  white-space: nowrap;
}
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; }
.badge-present { background: #dcfce7; color: #15803d; }
.badge-late { background: #fef3c7; color: #b45309; }
.badge-halfday { background: #e0e7ff; color: #4338ca; }
.badge-absent { background: #fee2e2; color: #b91c1c; }
.badge-leave { background: #e0f2fe; color: #0369a1; }
.badge-muted { background: #f1f5f9; color: #64748b; }

.status-picker { display: flex; gap: 4px; flex-wrap: nowrap; }
.pill {
  border: 1px solid var(--border); background: #fff; color: var(--text-2);
  padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.12s;
}
.pill:hover:not(:disabled) { border-color: #94a3b8; }
.pill:disabled { opacity: 0.5; cursor: not-allowed; }
.pill-present.active { background: var(--green); border-color: var(--green); color: #fff; }
.pill-late.active { background: #f59e0b; border-color: #f59e0b; color: #fff; }
.pill-halfday.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.pill-absent.active { background: var(--red); border-color: var(--red); color: #fff; }
.pill-leave.active { background: var(--sky); border-color: var(--sky); color: #fff; }

.chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px 5px 6px;
}

/* ====================== Tabs & segmented ====================== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab {
  background: none; border: 0; padding: 10px 14px; cursor: pointer;
  font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-count { background: var(--red); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
.tab-count.muted-count { background: #e2e8f0; color: var(--text-2); }
.segmented { display: inline-flex; background: #f1f5f9; padding: 4px; border-radius: 10px; gap: 2px; }
.segmented button {
  border: 0; background: transparent; padding: 8px 16px; border-radius: 7px;
  font-weight: 600; color: var(--text-2); cursor: pointer;
}
.segmented button.active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); }

/* ====================== Dashboard bits ====================== */
.dept-list { display: flex; flex-direction: column; gap: 16px; }
.dept-top { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
.dept-name { font-weight: 600; }
.progress { height: 8px; background: #eef2f7; border-radius: 999px; overflow: hidden; flex: 1; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 999px; }
.progress span.low { background: linear-gradient(90deg, #f97316, #ef4444); }
.pct { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.pct > span { font-weight: 600; font-variant-numeric: tabular-nums; width: 48px; text-align: right; }

/* ====================== Check-in ====================== */
.checkin-card {
  display: grid; grid-template-columns: 1.1fr 1.4fr auto; gap: 28px; align-items: center;
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #6366f1 100%);
  color: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 14px 40px rgba(37, 99, 235, 0.3);
}
.checkin-card .muted { color: #c7d2fe; }
.clock { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.checkin-times {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  background: rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 16px;
}
.checkin-times > div { display: flex; flex-direction: column; gap: 6px; }
.checkin-times strong { font-size: 17px; }
.checkin-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 200px; }
.checkin-actions .alert { margin: 0; }

/* ====================== Reports ====================== */
.report-banner {
  display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.report-banner h3 { font-size: 17px; margin-bottom: 4px; }
.report-kpis { display: flex; gap: 10px; flex-wrap: wrap; }
.kpi { display: flex; flex-direction: column; align-items: center; padding: 8px 14px; border-radius: 10px; min-width: 78px; }
.kpi strong { font-size: 18px; }
.kpi span { font-size: 11.5px; font-weight: 500; }

/* ====================== Profile ====================== */
.profile-head { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
.profile-head h3 { font-size: 18px; }
.details { margin: 0; display: grid; gap: 0; }
.details > div { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f1f5f9; }
.details dt { color: var(--muted); }
.details dd { margin: 0; font-weight: 500; }

/* ====================== Alerts, empty, loader ====================== */
.alert { padding: 11px 14px; border-radius: 9px; margin-bottom: 16px; font-weight: 500; font-size: 13.5px; }
.alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.empty { display: flex; flex-direction: column; align-items: center; padding: 40px 16px; color: #94a3b8; text-align: center; }
.empty-title { font-weight: 600; color: var(--text-2); margin-top: 10px; }
.empty-text { font-size: 13px; margin-top: 4px; }
.loader { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--muted); }
.loader-full { height: 100vh; }
.spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2.5px solid #dbeafe; border-top-color: var(--primary);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ====================== Modal ====================== */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(2px);
  display: grid; place-items: center; padding: 20px;
  animation: fade 0.15s ease;
}
.modal {
  background: #fff; width: 100%; border-radius: 14px; box-shadow: var(--shadow-lg);
  max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  animation: pop 0.18s ease;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 17px; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-body p { margin-top: 0; line-height: 1.55; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); }
.modal-foot.inline { padding: 14px 0 0; margin-top: 4px; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } }

.date-nav { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.date-nav input { border: 0; padding: 6px 8px; box-shadow: none !important; }

/* ====================== Login ====================== */
.login-page { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 100vh; }
.login-hero {
  background:
    radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.45), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.5), transparent 45%),
    #0b1226;
  color: #fff; padding: 40px 56px; display: flex; flex-direction: column; justify-content: space-between;
}
.brand-light .brand-name { font-size: 20px; }
.hero-copy h1 { font-size: 40px; line-height: 1.15; max-width: 480px; letter-spacing: -0.02em; }
.hero-copy p { color: #cbd5e1; font-size: 16px; max-width: 460px; line-height: 1.6; }
.hero-points { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 14px; }
.hero-points li { display: flex; align-items: center; gap: 12px; color: #e2e8f0; font-weight: 500; }
.hero-points svg { color: #93c5fd; }
.hero-foot { color: #64748b; font-size: 13px; }
.login-panel { display: grid; place-items: center; padding: 32px; background: #fff; }
.login-card { width: 100%; max-width: 380px; }
.login-card h2 { font-size: 26px; margin-bottom: 6px; }
.login-card > .muted { margin: 0 0 24px; }
.login-card .btn-lg { margin-top: 8px; }

/* ================= Theme: black sidebar + coral accent (matches reference) ================= */
:root {
  --primary: #e5564b;
  --primary-600: #cc4136;
  --primary-50: #fdeeec;
  --bg: #f3f4f7;
  --border: #e6e8ee;
  --text: #1d2130;
  --text-2: #4b5161;
  --muted: #7a8090;
  --sidebar: #0e0e10;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04);
}
body { font-size: 13.5px; }
.badge::before { display: none; }
.badge { padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.badge-present { background: #e7f6ec; color: #1f7a3d; }
.badge-late { background: #fdf1df; color: #a35c0a; }
.badge-halfday { background: #fde8e7; color: #c0362c; }
.badge-absent { background: #fde2e1; color: #b42318; }
.badge-leave { background: #e5f1fb; color: #1f6aa5; }
.badge-holiday { background: #eef0f4; color: #4b5161; }
.badge-working { background: #e7f6ec; color: #1f7a3d; display: inline-block; }
.badge-muted { background: #f1f2f5; color: #6b7280; }

/* Sidebar */
.sidebar { background: var(--sidebar); padding: 0; color: #d4d4d8; }
.brand { padding: 16px 20px; margin: 0; border-bottom: 1px solid #1d1d21; gap: 12px; }
.brand-logo { width: 36px; height: 36px; border-radius: 9px; background: #e0685d; box-shadow: none; }
.brand-name { font-size: 14.5px; font-weight: 700; letter-spacing: .01em; }
.brand-sub { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #c3c3ca; margin-top: 1px; }
.nav { padding: 6px 0 12px; gap: 0; overflow-y: auto; }
.nav-section { padding: 18px 20px 8px; font-size: 10.5px; letter-spacing: .14em; color: #8a8a94; }
.nav-link { border-radius: 0; padding: 9px 20px 9px 17px; color: #d4d4d8; font-size: 13.5px; font-weight: 500; border-left: 3px solid transparent; gap: 12px; }
.nav-link .icon { width: 17px; height: 17px; }
.nav-link:hover { background: #17171a; color: #fff; }
.nav-link.active { background: #18181c; color: var(--primary); border-left-color: var(--primary); box-shadow: none; font-weight: 600; }
.side-user { margin-top: auto; border-top: 1px solid #1d1d21; padding: 12px 14px 12px 20px; display: flex; align-items: center; gap: 10px; }
.side-user-text { flex: 1; min-width: 0; }
.side-user-name { color: #fff; font-weight: 600; font-size: 13px; }
.side-user-role { color: #8a8a94; font-size: 11.5px; }
.side-logout { color: #8a8a94; }
.side-logout:hover { background: #1d1d21 !important; color: #fca5a5 !important; }
.avatar-brand { background: #e0685d !important; color: #fff !important; }

/* Topbar */
.topbar { height: 56px; background: #fff; backdrop-filter: none; padding: 0 24px; }
.crumbs { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 13px; color: var(--muted); min-width: 0; }
.crumbs strong { color: var(--text); font-weight: 600; }
.crumb-brand { font-weight: 700 !important; }
.crumb-sep-bar { width: 1px; height: 16px; background: var(--border); }
.icon-xs { width: 13px; height: 13px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-date { color: var(--muted); font-size: 12.5px; }

.content { padding: 28px 40px 40px; max-width: 1480px; margin: 0 auto; }
.app-foot { margin-top: auto; padding: 10px 24px; text-align: right; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); background: #fff; }
.main { min-height: 100vh; }
.page-header h1 { font-size: 21px; font-weight: 600; }
.page-header p { font-size: 13.5px; }

/* Cards / buttons */
.card { border-radius: 12px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.card-head.padded { padding: 18px 20px 14px; margin: 0; flex-wrap: wrap; gap: 10px; }
.card.flush .table-wrap { margin: 0; padding: 0; }
.card.flush .empty { padding-bottom: 36px; }
.btn { font-weight: 500; font-size: 13.5px; border-radius: 8px; }
.btn-primary { box-shadow: none; }
.btn-outline { background: #fff; border: 1px solid #d5d8e0; color: var(--text); }
.btn-outline:hover:not(:disabled) { border-color: #b6bac6; background: #fafbfc; }
.stat-card, .ws-stat { box-shadow: var(--shadow); }
.stat-card:hover { transform: none; box-shadow: 0 4px 14px rgba(16, 24, 40, .06); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.segmented button.active { color: var(--primary); }
.link { color: var(--primary); }
.progress span { background: linear-gradient(90deg, #ef8a72, #e5564b); }
.avatar { background: #f1f2f6; color: #3d4252; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(229, 86, 75, .14); }
.spinner { border-color: #fbd9d5; border-top-color: var(--primary); }

/* Workspace */
.ws-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 26px; }
.ws-stat { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; }
.ws-stat-icon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
.ws-stat-icon .icon { width: 18px; height: 18px; }
.ws-stat-value { font-size: 19px; font-weight: 700; line-height: 1.2; }
.ws-stat-label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); margin-top: 3px; }
.ws-stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tone-violet { background: #f1ecfd; color: #7c3aed; }
.tone-amber { background: #fdf1e3; color: #b8651b; }
.tone-red { background: #fdeceb; color: #d1403a; }
.tone-green { background: #e7f6ec; color: #1f7a3d; }

.ws-tabs { display: flex; gap: 6px; margin-bottom: 26px; flex-wrap: wrap; }
.ws-tab { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #5d6474; cursor: pointer; }
.ws-tab:hover { color: var(--text); background: rgba(255, 255, 255, .6); }
.ws-tab.active { background: #fff; color: #6b2f1f; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); }
.ws-tab.active .icon { color: var(--primary); }

.shift-card { padding: 22px 20px 18px; }
.shift-top { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.shift-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.shift-line { display: flex; align-items: center; gap: 6px; color: #4b5161; font-size: 14px; margin-top: 5px; }
.shift-sub { font-size: 12.5px; margin-top: 8px; }
.shift-actions { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.shift-bottom { padding-top: 14px; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.strong { font-weight: 700; color: var(--text); }
.tone-text-green { color: #1f9d55; }
.tone-text-red { color: #d1403a; }
.s-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.s-chip { display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.chip-expected { background: #fbeee0; color: #7a4a14; }
.chip-live { background: #fde9e2; color: #8f3418; }
.chip-done { background: #e9f6ee; color: #1f6b3a; }
.chip-idle { background: #eef1f6; color: #3f4a5f; }
.chip-missed { background: #fde2e1; color: #b42318; }
.ot-tag { display: inline-block; background: #f1ecfd; color: #6d28d9; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; }
.live { color: #1f9d55; font-weight: 600; }
.cell-note { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.ws-table td { padding: 12px 16px; }
.ws-table th { padding: 11px 16px; background: #fafbfc; }
.ws-table tfoot td { background: #fafbfc; border-top: 1px solid var(--border); padding: 12px 16px; }
.row-today { background: #fff8f6; }
.week-label { font-weight: 600; font-size: 13px; padding: 0 6px; white-space: nowrap; }
.demo-clock { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border: 1px dashed #d5d8e0; border-radius: 10px; color: var(--muted); font-size: 12.5px; background: #fff; }
.demo-clock span { display: inline-flex; align-items: center; gap: 6px; }
.demo-clock select { padding: 6px 10px; }

.ot-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #f8f9fb; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.ot-summary span { display: block; font-size: 11.5px; color: var(--muted); }
.ot-summary strong { font-size: 13.5px; }
.ot-preview { min-height: 22px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }

.slip-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.slip-meta > div { background: #fff; padding: 10px 14px; }
.slip-meta span { display: block; font-size: 11.5px; color: var(--muted); }

.slip-grid { margin-bottom: 14px; }
.slip { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.slip td, .slip th { padding: 10px 14px; }
.slip tfoot td { background: #fafbfc; border-top: 1px solid var(--border); }
.net-pay { display: flex; justify-content: space-between; align-items: center; background: var(--primary-50); color: #7a2016; border-radius: 10px; padding: 14px 18px; font-size: 15px; }
.net-pay strong { font-size: 20px; }

/* Login */
.login-hero { background: radial-gradient(circle at 15% 15%, rgba(229, 86, 75, .35), transparent 40%), radial-gradient(circle at 85% 85%, rgba(229, 86, 75, .18), transparent 45%), #0e0e10; }
.hero-points svg { color: #f2a196; }

@media (max-width: 1100px) {
  .ws-stats { grid-template-columns: repeat(2, 1fr); }
  .slip-meta { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .content { padding: 18px; }
  .topbar-date { display: none; }
  .shift-top { flex-direction: column; align-items: flex-start; }
  .shift-actions { justify-content: flex-start; }

}

  const hm = (m) => (m ? `${Math.floor(m / 60)}h ${pad(Math.round(m) % 60)}m` : '—');

  const uid = () => Math.random().toString(36).slice(2, 10);
  const initials = (n) => (n || '').split(' ').filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('');
  const cls = (s) => (s || '').toLowerCase().replace(/[^a-z]/g, '');
  const workingDays = (f, t) => eachDay(f, t).filter((d) => !isOff(d));
  const OT_SHIFT = { key: 'ot', label: 'Overtime', start: '00:00', end: '23:59' }; // separate overtime timer
  const shiftOf = (k) => (k === 'ot' ? OT_SHIFT : SHIFTS.find((s) => s.key === k));

  /* ---- clock (with optional demo simulation) ---- */
  let sim = null; // { real: ms, sec: seconds-of-day }
  const nowSec = () => {
    if (sim) return Math.min(86399, sim.sec + (Date.now() - sim.real) / 1000);

  };
  const nowMinF = () => nowSec() / 60;
  const nowHH = () => minToHH(Math.floor(nowMinF()));

  /* ---- shift sessions → day record ---- */
  const sessionMins = (s) => {
    if (!s.in) return 0;
    const end = s.out ? toMin(s.out) : nowMinF();

  };

  // Auto clock-out at shift end, then derive check-in/out, hours, overtime and status
  function syncRec(rec, date) {
    if (!rec || !rec.sessions) return false;
    let changed = false;
    const nm = date === today() ? nowMinF() : 1e9;
    rec.sessions.forEach((s) => {

    const last = ses[ses.length - 1];

      const reg = ses.filter(isReg);
      const prev = rec.status;
      if (!reg.length) {
        // overtime only: fine on a day off; on a working day both shifts were missed
        rec.autoHalf = false;
        rec.status = isOff(date) || nm < toMin(SHIFTS[SHIFTS.length - 1].end) ? 'Present' : 'Absent';
      } else {
        const missed = SHIFTS.filter((sh) => !reg.some((s) => s.shift === sh.key) && nm >= toMin(sh.end)).length;
        const first = reg[0];
        rec.autoHalf = missed > 0;
        rec.status = missed > 0 ? 'Half-day' : toMin(first.in) > toMin(shiftOf(first.shift).start) + GRACE ? 'Late' : 'Present';
      }
      if (prev !== rec.status) changed = true;
    }
    return changed;
  }

    people.forEach(([employeeId, name, department, designation, salary], i) => users.push({
      id: `u${i + 1}`, role: 'employee', employeeId, name, department, designation, salary,
      email: `${name.split(' ')[0].toLowerCase()}@company.com`, password: 'Employee@123', pin: '1234',
      phone: `98${ri(10000000, 99999999)}`, joinDate: `20${ri(21, 25)}-${pad(ri(1, 12))}-${pad(ri(1, 28))}`,
      status: i === 11 ? 'inactive' : 'active',
    }));

    const att = {};
    const t = today();
    for (let i = 365; i >= 1; i -= 1) {
      const d = addDays(t, -i);
      if (isOff(d)) continue;
      users.forEach((u) => {
        if (u.joinDate > d) return;
        const x = r();
        const k = `${u.id}|${d}`;
        if (x < 0.035) { att[k] = { status: 'Absent', source: 'system', remarks: '' }; return; }
        if (x < 0.065) { att[k] = { status: 'Leave', source: 'leave', remarks: r() < 0.3 ? 'Sick leave' : 'Casual leave' }; return; }
        const ses = [{ shift: 'morning', in: minToHH(ri(535, 562)), out: '13:00', auto: true }];
        if (x >= 0.13) {
          const s = { shift: 'afternoon', in: minToHH(ri(895, 911)), out: '19:00', auto: true };
          if (x > 0.93) Object.assign(s, { out: minToHH(ri(1170, 1235)), auto: false, manual: true, reason: OT_REASONS[0] });
          ses.push(s);
        }
        const rec = { sessions: ses, source: 'self', remarks: '' };
        syncRec(rec, d);
        att[k] = rec;
      });
    }
    // Today: a few people are already at work (only up to the current time)
    if (!isOff(t)) {
      const nm = Math.floor(nowMinF());
      users.filter((u) => u.role === 'employee' && u.status === 'active' && u.id !== 'u1').slice(0, 7).forEach((u) => {
        if (nm < 536) return;
        const ses = [{ shift: 'morning', in: minToHH(ri(535, Math.min(562, nm))), out: null }];
        if (nm >= 896) ses.push({ shift: 'afternoon', in: minToHH(ri(895, Math.min(911, nm))), out: null });
        const rec = { sessions: ses, source: 'self', remarks: '' };
        syncRec(rec, t);
        att[`${u.id}|${t}`] = rec;
      });
    }

    const lv = (empId, type, f, to, reason, status, comment = '') => ({
      id: uid(), empId, type, from: f, to, days: workingDays(f, to).length || 1, reason, status, comment,
      createdAt: Date.now() - ri(1, 9) * 86400000, reviewedBy: status === 'Pending' ? '' : 'Admin',
    });
    const leaves = [
      lv('u2', 'Sick', addDays(t, 2), addDays(t, 3), 'Medical appointment and recovery', 'Pending'),
      lv('u5', 'Casual', addDays(t, 7), addDays(t, 7), 'Family function', 'Pending'),
      lv('u7', 'Earned', addDays(t, 12), addDays(t, 16), 'Vacation with family', 'Pending'),
      lv('u1', 'Casual', addDays(t, -20), addDays(t, -20), 'Personal work', 'Approved', 'Approved. Enjoy!'),
      lv('u4', 'Other', addDays(t, -5), addDays(t, -4), 'Sister\'s wedding preparations', 'Rejected', 'Quarter-end sales review, please reschedule'),
    ];
    const docs = {};
    const pool = { 'Signed Documents': ['Offer letter.pdf', 'Appointment letter.pdf', 'Employment contract.pdf', 'Code of conduct acknowledgement.pdf', 'Policy handbook sign-off.pdf'],
      'ID & Address Proofs': ['Aadhaar card.pdf', 'PAN card.pdf', 'Address proof.pdf'], Certificates: ['Degree certificate.pdf', 'Experience letter.pdf', 'Safety training certificate.pdf'],
      'Non-Disclosure Agreements': ['NDA.pdf', 'Client NDA.pdf'] };
    users.forEach((u) => {
      docs[u.id] = [];
      Object.entries(pool).forEach(([folder, names]) => {
        names.slice(0, ri(1, names.length)).forEach((name) => docs[u.id].push({ folder, name, date: u.joinDate || addDays(t, -300) }));
      });
    });
    return { users, att, leaves, docs, session: null };
  }

  /* ===================== My Workspace ===================== */
  let wsTab = 'attendance';
  let wsWeek = weekRange(today()).from;
  let wsPayMonth = today().slice(0, 7);
  let wsKey = '';

  function dayPhase(u, rec) {
    const t = today();
    const all = rec?.sessions || [];
    const ot = all.find((s) => !isReg(s) && !s.out) || null;
    const hol = isHoliday(t);
    if (hol) return { phase: 'holiday', note: hol, ot };
    if (rec && rec.source === 'admin' && !rec.sessions) return { phase: 'admin' };
    if (rec?.status === 'Leave' || approvedLeaveOn(u.id, t)) return { phase: 'leave', ot };
    const nm = nowMinF();
    const ses = all.filter(isReg);
    const open = ses.find((s) => !s.out);
    if (open) return { phase: 'open', shift: shiftOf(open.shift), session: open };
    for (const sh of SHIFTS) {
      if (!ses.some((s) => s.shift === sh.key) && nm >= toMin(sh.start) - OPEN_EARLY && nm < toMin(sh.end)) return { phase: 'clockable', shift: sh, ot };
    }
    const next = SHIFTS.find((sh) => nm < toMin(sh.start) - OPEN_EARLY);
    if (next) return { phase: ses.length ? 'break' : 'before', shift: next, weeklyOff: isWeeklyOff(t), ot };
    return { phase: 'done', weeklyOff: isWeeklyOff(t), ot };
  }
  const lastSession = (rec) => [...(rec?.sessions || [])].filter(isReg).sort((a, b) => toMin(b.in) - toMin(a.in))[0];
  const workedSecToday = (rec) => (rec?.sessions || []).reduce((a, s) => a + sessionMins(s) * 60, 0);

  function payslip(u, ym) {
    const { from, to } = monthRange(ym);
    const wd = workingDays(from, to).length;
    const gross = u.salary || 0;
    const c = { present: 0, late: 0, half: 0, absent: 0, leave: 0, unpaid: 0, ot: 0 };
    eachDay(from, to).forEach((d) => {
      const r = getAtt(u.id, d); if (!r) return;
      if (r.status === 'Absent') c.absent += 1;
      else if (r.status === 'Half-day') c.half += 1;
      else if (r.status === 'Leave') { c.leave += 1; const l = approvedLeaveOn(u.id, d); if (l?.type === 'Unpaid') c.unpaid += 1; }
      else if (r.status === 'Late') c.late += 1;
      else c.present += 1;
      c.ot += r.otMinutes || 0;
    });
    const lop = c.absent + c.unpaid + c.half * 0.5;
    const perDay = wd ? gross / wd : 0;
    const lopAmt = Math.round(lop * perDay);
    const parts = [['Basic Salary', 0.5], ['House Rent Allowance', 0.2], ['Conveyance Allowance', 0.1]].map(([n, p]) => [n, Math.round(gross * p)]);
    parts.push(['Special Allowance', gross - parts.reduce((a, p) => a + p[1], 0)]);
    const pt = gross >= 15000 ? 200 : 0;
    const deductions = [['Loss of Pay', lopAmt], ['Professional Tax', pt]];
    const totalDed = lopAmt + pt;
    return { ym, wd, gross, c, lop, paidDays: wd - lop, perDay, earnings: parts, deductions, totalDed, net: gross - totalDed };
  }

  function viewWorkspace(c, u) {
    const t = today();

      if (r.status === 'Half-day') halfs += 1;
      if (r.status === 'Leave') leaveTaken += 1;
    });
    const pendingDays = db.leaves.filter((l) => l.empId === u.id && l.status === 'Pending').reduce((a, l) => a + l.days, 0);

    c.innerHTML = `<div class="ws">

  function shiftChip(sh, rec, ph) {
    const s = (rec?.sessions || []).find((x) => x.shift === sh.key);
    const nm = nowMinF();
    let state;
    if (s && !s.out) state = `${s.in} – now`;
    else if (s) state = `${s.in} – ${s.out}${s.manual ? ' (OT entry)' : ''}`;
    else if (ph.phase === 'holiday' || ph.phase === 'leave' || ph.phase === 'admin') state = '—';
    else if (nm >= toMin(sh.end)) state = 'missed';
    else state = 'not started';
    const tone = s && !s.out ? 'chip-live' : s ? 'chip-done' : state === 'missed' ? 'chip-missed' : 'chip-idle';
    return `<span class="s-chip ${tone}">${sh.label} ${sh.start}–${sh.end} · ${state}</span>`;
  }

  function attendanceTab(u) {
    const t = today();
    const rec = getAtt(u.id, t);
    const ph = dayPhase(u, rec);
    wsKey = phaseKey(u);
    const nm = nowMinF();
    const last = lastSession(rec);
    const otRun = ph.ot;
    const otBtn = () => (otRun
      ? `<button class="btn btn-ot running" data-act="ot-stop">${ic('ot', 'icon icon-sm')} Stop OT <span class="mono" id="ws-ot">${hms(sessionMins(otRun) * 60)}</span></button>`
      : `<button class="btn btn-ot" data-act="ot-open">${ic('ot', 'icon icon-sm')} OT</button>`);
    const otLine = otRun ? `<div class="shift-line ot-line">${ic('ot', 'icon icon-sm')} Overtime running since ${otRun.in}</div>` : '';
    let title; let lines = ''; let actions = '';
    const workedLine = `<div class="shift-sub muted">Worked today: <span class="mono" id="ws-worked">${hms(workedSecToday(rec))}</span>${rec?.otMinutes ? ` · <span class="ot-tag">+${hm(rec.otMinutes)} OT</span>` : ''}</div>`;

    switch (ph.phase) {
      case 'open':
        title = `On the ${ph.shift.label.toLowerCase()} shift`;
        lines = `<div class="shift-line">Clocked in at ${ph.session.in} · auto clock out at ${ph.shift.end}</div>
          <div class="shift-line">${ic('timer', 'icon icon-sm tone-text-green')} Time left in shift <span class="mono strong" id="ws-left">${hms(toMin(ph.shift.end) * 60 - nowSec())}</span></div>${workedLine}`;
        actions = `${otBtn()}<button class="btn btn-outline" data-act="clock-out">${ic('logout', 'icon icon-sm')} Clock Out</button>`;
        break;
      case 'clockable': {
        const late = nm > toMin(ph.shift.start) + GRACE;
        title = `${ph.shift.label} shift is open`;
        lines = `<div class="shift-line">Shift ${ph.shift.start}–${ph.shift.end}${late ? ' · <span class="tone-text-red">you will be marked late</span>' : ''}</div>
          <div class="shift-line">${ic('timer', 'icon icon-sm tone-text-green')} Time left in shift <span class="mono strong" id="ws-left">${hms(toMin(ph.shift.end) * 60 - nowSec())}</span></div>${workedLine}`;
        actions = `${otBtn()}<button class="btn btn-primary" data-act="clock-in">${ic('login', 'icon icon-sm')} Clock In</button>`;
        break;
      }
      case 'before':
      case 'break':
        title = ph.phase === 'break' ? 'On break' : `${ph.weeklyOff ? 'Weekly off · ' : ''}Shift starts at ${ph.shift.start}`;
        lines = `<div class="shift-line">${ph.shift.label} shift ${ph.shift.start}–${ph.shift.end} · clock in opens at ${minToHH(toMin(ph.shift.start) - OPEN_EARLY)}</div>
          <div class="shift-line">${ic('hourglass', 'icon icon-sm')} Clock in opens in <span class="mono strong" id="ws-left">${hms((toMin(ph.shift.start) - OPEN_EARLY) * 60 - nowSec())}</span></div>${workedLine}`;
        actions = otBtn();
        break;
      case 'done':
        title = last ? 'Day complete' : ph.weeklyOff ? 'Weekly off' : 'No shifts worked today';
        lines = `<div class="shift-line">All shifts for today have ended. Working extra? Press <strong>OT</strong> to start overtime or enter your actual out time.</div>${workedLine}`;
        actions = otBtn();
        break;
      case 'holiday': title = `Holiday · ${esc(ph.note)}`; lines = `<div class="shift-line">Enjoy your day off! Working today? Press OT to log overtime.</div>${workedLine}`; actions = otBtn(); break;
      case 'leave': title = 'On leave today'; lines = `<div class="shift-line">Your approved leave covers today.</div>${workedLine}`; actions = otBtn(); break;
      case 'admin': title = `Marked ${rec.status} by admin`; lines = `<div class="shift-line">${rec.checkIn ? `In ${rec.checkIn} · Out ${rec.checkOut || '—'}` : 'Your attendance for today was recorded by HR.'}</div>`; break;
      default: title = '';
    }
    lines += otLine;

    // This month table (records + holidays)
    const ym = t.slice(0, 7);
    const { from, to } = monthRange(ym);
    const rows = eachDay(from, to).reverse().map((d) => {
      const r = getAtt(u.id, d);
      if (isHoliday(d)) return `<tr><td>${d}</td><td><span class="badge badge-holiday">Holiday</span><div class="cell-note">${esc(isHoliday(d))}</div></td><td>—</td><td>—</td><td class="num">0</td></tr>`;
      if (!r) return '';
      const manual = r.sessions?.some((s) => s.manual);
      const note = r.autoHalf && r.status === 'Half-day' ? 'Set automatically' : r.source === 'admin' ? 'Marked by admin' : manual ? 'Out time entered' : '';
      return `<tr><td>${d}</td><td>${badge(r.status)}${note ? `<div class="cell-note">${note}</div>` : ''}</td><td>${r.checkIn || '—'}</td><td>${r.checkOut || '—'}</td>
        <td class="num">${hrs(r.workMinutes)}${r.otMinutes ? ` <span class="ot-tag">+${hrs(r.otMinutes)} OT</span>` : ''}</td></tr>`;
    }).join('');

    return `<div class="card shift-card">
        <div class="shift-top"><div><h3 class="shift-title">${title}</h3>${lines}</div><div class="shift-actions">${actions}</div></div>
        <div class="shift-bottom"><div class="muted small">${fmtDate(t, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
          <div class="s-chips"><span class="s-chip chip-expected">Expected today: ${isOff(t) ? 0 : EXPECTED_MIN / 60} h</span>${SHIFTS.map((sh) => shiftChip(sh, rec, ph)).join('')}${rec?.status ? `<span class="s-chip chip-idle">Status: ${rec.status === 'Half-day' ? 'Half Day' : rec.status}</span>` : ''}</div>
        </div>
      </div>
      <div class="card flush"><div class="card-head padded"><h3>This month</h3><span class="muted small">${monthLabel(ym)}</span></div>
        ${rows ? `<div class="table-wrap"><table class="table ws-table"><thead><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th><th class="num">Hours</th></tr></thead><tbody>${rows}</tbody></table></div>` : empty('No attendance yet this month')}
      </div>
      <div class="demo-clock"><span>${ic('clock', 'icon icon-sm')} <strong>Demo clock</strong>: try shifts, auto clock-out and OT without waiting${sim ? ' · <em>changes made now are temporary</em>' : ''}</span>
        <select id="sim-time"><option value="">Real time</option>${['08:40', '09:05', '09:25', '12:58', '13:30', '14:45', '15:20', '18:59', '19:40'].map((x) => `<option value="${x}" ${sim && sim.label === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`;
  }

  function phaseKey(u) {
    const rec = getAtt(u.id, today());
    const ph = dayPhase(u, rec);
    return `${ph.phase}|${ph.shift?.key || ''}|${rec?.status || ''}|${(rec?.sessions || []).map((s) => s.in + s.out).join(',')}`;
  }

  function startTick(u) {
    clearInterval(timer);
    timer = setInterval(() => {
      if (!$('#ws-body')) return clearInterval(timer);
      const changed = syncToday();
      if ((changed || phaseKey(u) !== wsKey) && !modalOpen()) {
        const before = getAtt(u.id, today())?.sessions?.find((s) => s.auto && s.out === nowHH());
        viewWorkspace($('#content'), u);
        if (before) toast(`Auto clocked out at ${before.out} (end of ${before.shift} shift)`);
        return;
      }
      const rec = getAtt(u.id, today());
      const ph = dayPhase(u, rec);
      const left = $('#ws-left');
      if (left) {
        const target = ph.phase === 'open' || ph.phase === 'clockable' ? toMin(ph.shift.end) * 60 : ph.shift ? (toMin(ph.shift.start) - OPEN_EARLY) * 60 : 0;
        left.textContent = hms(target - nowSec());
      }
      const w = $('#ws-worked'); if (w) w.textContent = hms(workedSecToday(rec));
      const otEl = $('#ws-ot'); const otS = rec?.sessions?.find((s) => !isReg(s) && !s.out); if (otEl && otS) otEl.textContent = hms(sessionMins(otS) * 60);
    }, 1000);
  }

  function timesheetTab(u) {
    const { from, to } = { from: wsWeek, to: addDays(wsWeek, 6) };
    let tot = 0; let exp = 0; let otT = 0;
    const cell = (r, sh) => {
      const s = r?.sessions?.find((x) => x.shift === sh.key);
      if (s) return `${s.in} – ${s.out || '<span class="live">now</span>'}${s.manual ? ' <span class="ot-tag">OT</span>' : ''}`;
      if (r?.source === 'admin' && sh.key === 'morning' && r.checkIn) return `${r.checkIn} – ${r.checkOut || '—'}`;
      return '<span class="muted">—</span>';
    };
    const rows = eachDay(from, to).map((d) => {
      const r = getAtt(u.id, d);
      const e = isOff(d) || r?.status === 'Leave' ? 0 : EXPECTED_MIN;
      const live = d === today() && r?.sessions ? Math.round(workedSecToday(r) / 60) : r?.workMinutes || 0;
      if (d <= today()) { tot += live; exp += e; otT += r?.otMinutes || 0; }
      const diff = d <= today() ? live - e : null;
      const st = isHoliday(d) ? '<span class="badge badge-holiday">Holiday</span>' : isWeeklyOff(d) ? '<span class="badge badge-muted">Weekly off</span>' : r ? badge(r.status) : d > today() ? '<span class="muted small">Upcoming</span>' : badge('');
      return `<tr class="${d === today() ? 'row-today' : ''}"><td class="nowrap"><strong>${weekday(d)}</strong> <span class="muted small">${fmtDate(d, { day: '2-digit', month: 'short' })}</span></td>
        <td>${cell(r, SHIFTS[0])}</td><td>${cell(r, SHIFTS[1])}</td><td>${st}</td>
        <td class="num">${live ? hm(live) : '—'}</td><td class="num">${r?.otMinutes ? hm(r.otMinutes) : '—'}</td><td class="num">${e ? '8h' : '—'}</td>
        <td class="num ${diff == null || !e ? '' : diff >= 0 ? 'tone-text-green' : 'tone-text-red'}">${diff == null || (!e && !live) ? '—' : `${diff >= 0 ? '+' : '−'}${hm(Math.abs(diff)) === '—' ? '0h 00m' : hm(Math.abs(diff))}`}</td></tr>`;
    }).join('');
    return `<div class="card flush"><div class="card-head padded"><h3>Weekly timesheet</h3>
        <div class="date-nav"><button class="icon-btn" data-act="ws-week" data-n="-7">${ic('left')}</button><span class="week-label">${fmtDate(from, { day: '2-digit', month: 'short' })} – ${fmtDate(to, { day: '2-digit', month: 'short', year: 'numeric' })}</span><button class="icon-btn" data-act="ws-week" data-n="7" ${to >= today() ? 'disabled' : ''}>${ic('right')}</button></div></div>
      <div class="table-wrap"><table class="table ws-table"><thead><tr><th>Day</th><th>Morning 09:00–13:00</th><th>Afternoon 15:00–19:00</th><th>Status</th><th class="num">Worked</th><th class="num">OT</th><th class="num">Expected</th><th class="num">Variance</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td colspan="4"><strong>Week total</strong></td><td class="num"><strong>${hm(tot)}</strong></td><td class="num"><strong>${hm(otT)}</strong></td><td class="num"><strong>${hm(exp)}</strong></td>
      <td class="num ${tot - exp >= 0 ? 'tone-text-green' : 'tone-text-red'}"><strong>${tot - exp >= 0 ? '+' : '−'}${hm(Math.abs(tot - exp)) === '—' ? '0h 00m' : hm(Math.abs(tot - exp))}</strong></td></tr></tfoot></table></div></div>`;
  }

  function leaveTab(u) {
    const items = db.leaves.filter((l) => l.empId === u.id).sort((a, b) => b.createdAt - a.createdAt);
    const approved = items.filter((l) => l.status === 'Approved').reduce((s, l) => s + l.days, 0);
    const pending = items.filter((l) => l.status === 'Pending').length;
    return `<div class="card flush"><div class="card-head padded"><div><h3>My leave requests</h3><span class="muted small">${approved} approved day(s) · ${pending} pending request(s)</span></div>
      <button class="btn btn-primary" data-act="leave-new">${ic('plus', 'icon icon-sm')} Apply for Leave</button></div>
      ${items.length ? `<div class="table-wrap"><table class="table ws-table"><thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>HR comment</th><th></th></tr></thead><tbody>
        ${items.map((l) => `<tr><td>${l.type}</td><td>${fmtDate(l.from)}</td><td>${fmtDate(l.to)}</td><td>${l.days}</td><td class="wrap">${esc(l.reason)}</td><td>${leaveBadge(l.status)}</td><td class="muted">${esc(l.comment || '—')}</td>
          <td class="right">${l.status === 'Pending' ? `<button class="btn btn-ghost btn-sm" data-act="leave-cancel" data-id="${l.id}">${ic('ban', 'icon icon-sm')} Cancel</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : empty('No leave requests yet', 'Use “Apply for Leave” to submit your first request.')}</div>`;
  }

  function salaryTab(u) {
    const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; });
    const p = payslip(u, wsPayMonth);
    const cur = wsPayMonth === today().slice(0, 7);
    const row = (a, b) => `<tr><td>${a}</td><td class="num">${b}</td></tr>`;
    return `<div class="card">
      <div class="card-head"><div><h3>Salary slip · ${monthLabel(wsPayMonth)}</h3>${cur ? '<span class="muted small">Month in progress: figures update as attendance is recorded</span>' : ''}</div>
        <div class="page-actions"><select id="pay-month">${months.map((m) => `<option value="${m}" ${m === wsPayMonth ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select>
        <button class="btn btn-outline" data-act="payslip-pdf">${ic('file', 'icon icon-sm')} Download PDF</button></div></div>
      <div class="slip-meta">
        <div><span>Employee</span><strong>${esc(u.name)}</strong></div><div><span>Employee ID</span><strong>${esc(u.employeeId || '—')}</strong></div>
        <div><span>Designation</span><strong>${esc(u.designation || '—')}</strong></div><div><span>Department</span><strong>${esc(u.department || '—')}</strong></div>
        <div><span>Working days</span><strong>${p.wd}</strong></div><div><span>Paid days</span><strong>${p.paidDays}</strong></div>
        <div><span>LOP days</span><strong>${p.lop}</strong></div><div><span>Overtime logged</span><strong>${hm(p.c.ot)}</strong></div>
      </div>
      <div class="grid-2 slip-grid">
        <table class="table slip"><thead><tr><th>Earnings</th><th class="num">Amount</th></tr></thead><tbody>${p.earnings.map(([n, v]) => row(n, money(v))).join('')}</tbody>
          <tfoot><tr><td><strong>Gross earnings</strong></td><td class="num"><strong>${money(p.gross)}</strong></td></tr></tfoot></table>
        <table class="table slip"><thead><tr><th>Deductions</th><th class="num">Amount</th></tr></thead><tbody>${p.deductions.map(([n, v]) => row(n, money(v))).join('')}</tbody>
          <tfoot><tr><td><strong>Total deductions</strong></td><td class="num"><strong>${money(p.totalDed)}</strong></td></tr></tfoot></table>
      </div>
      <div class="net-pay"><span>Net pay</span><strong>${money(p.net)}</strong></div>
      <p class="muted small" style="margin:10px 0 0">LOP = absent days + unpaid leave + ½ per half day. Per-day rate ${money(p.perDay)} (${money(p.gross)} ÷ ${p.wd} working days). Overtime is shown for reference; add an OT pay rule if your company pays overtime.</p>
    </div>`;
  }

  /* ===================== Admin: dashboard ===================== */
  function viewDashboard(c, u) {
    const t = today();
    const list = activeEmps();
    const cnt = { Present: 0, Late: 0, 'Half-day': 0, Absent: 0, Leave: 0 };
    const recs = [];
    list.forEach((e) => { const r = getAtt(e.id, t); if (r) { cnt[r.status] += 1; recs.push({ e, r }); } });
    const notMarked = list.length - recs.length;
    const attended = cnt.Present + cnt.Late + cnt['Half-day'];
    const rate = list.length ? Math.round((attended / list.length) * 1000) / 10 : 0;
    const pending = db.leaves.filter((l) => l.status === 'Pending');
    const working = recs.filter((x) => x.r.sessions?.some((s) => !s.out)).length;

    const trend = eachDay(addDays(t, -6), t).map((d) => {
      const o = { label: fmtDate(d, { weekday: 'short', day: '2-digit' }) };
      STATUSES.forEach((s) => { o[s] = 0; });
      list.forEach((e) => { const r = getAtt(e.id, d); if (r) o[r.status] += 1; });
      return o;
    });
    const deptMap = new Map();
    list.forEach((e) => {
      const d = e.department || 'Unassigned';
      if (!deptMap.has(d)) deptMap.set(d, { d, total: 0, present: 0, absent: 0, leave: 0 });
      const row = deptMap.get(d); row.total += 1;
      const r = getAtt(e.id, t);
      if (r && ['Present', 'Late', 'Half-day'].includes(r.status)) row.present += 1;
      else if (r?.status === 'Absent') row.absent += 1;
      else if (r?.status === 'Leave') row.leave += 1;
    });
    const recent = recs.filter((x) => x.r.checkIn).sort((a, b) => b.r.checkIn.localeCompare(a.r.checkIn)).slice(0, 8);
    const h = new Date().getHours();
    const greet = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';

    c.innerHTML = `${header(`Good ${greet}, ${esc(u.name.split(' ')[0])}`, `Attendance overview for ${fmtDate(t, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`,
      `<button class="btn btn-ghost" data-act="rerender">${ic('refresh', 'icon icon-sm')} Refresh</button><a href="#register" class="btn btn-primary">Open Register</a>`)}
      ${isHoliday(t) ? `<div class="alert alert-info">Today is a holiday: ${esc(isHoliday(t))}</div>` : ''}
      <div class="stats-grid">
        ${statCard('users', 'Active Employees', list.length, `${working} working right now`, 'slate')}
        ${statCard('userCheck', 'Present', cnt.Present, 'On time today', 'green')}
        ${statCard('clock', 'Late / Half-day', `${cnt.Late} / ${cnt['Half-day']}`, '', 'amber')}
        ${statCard('userX', 'Absent', cnt.Absent, '', 'red')}
        ${statCard('calendar', 'On Leave', cnt.Leave, '', 'sky')}
        ${statCard('alert', 'Not Marked', notMarked, '', 'slate')}
        ${statCard('percent', 'Attendance Rate', `${rate}%`, '', 'indigo')}
        ${statCard('calX', 'Pending Leaves', pending.length, '<a href="#leaves">Review requests →</a>', 'violet')}
      </div>
      <div class="grid-2-1">
        <div class="card"><div class="card-head"><h3>Last 7 days</h3><span class="muted small">Attendance by status</span></div><div class="chart-box"><canvas id="ch-trend"></canvas></div></div>
        <div class="card"><div class="card-head"><h3>Today’s status</h3></div><div class="chart-box"><canvas id="ch-pie"></canvas></div></div>
      </div>
      <div class="grid-2">
        <div class="card"><div class="card-head"><h3>Recent check-ins</h3><a href="#team-timesheets" class="link small">Team timesheets →</a></div>
          ${recent.length ? `<table class="table"><thead><tr><th>Employee</th><th>In</th><th>Out</th><th>Status</th></tr></thead><tbody>
          ${recent.map(({ e, r }) => `<tr><td>${person(e.name, e.department)}</td><td>${r.checkIn}</td><td>${r.checkOut || (r.sessions?.some((s) => !s.out) ? '<span class="live">working</span>' : '—')}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table>` : empty('No check-ins yet today')}
        </div>
        <div class="card"><div class="card-head"><h3>Departments today</h3></div><div class="dept-list">
          ${[...deptMap.values()].sort((a, b) => b.total - a.total).map((d) => `<div class="dept-row"><div class="dept-top"><span class="dept-name">${esc(d.d)}</span><span class="muted small">${d.present}/${d.total} present · ${d.leave} leave · ${d.absent} absent</span></div><div class="progress"><span style="width:${d.total ? Math.round((d.present / d.total) * 100) : 0}%"></span></div></div>`).join('')}
        </div></div>
      </div>
      ${pending.length ? `<div class="card"><div class="card-head"><h3>Pending leave requests</h3><a href="#leaves" class="link small">Review all →</a></div>
        <table class="table"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th></tr></thead><tbody>
        ${pending.map((l) => { const e = byId(l.empId); return `<tr><td>${person(e?.name || 'Deleted', e?.employeeId)}</td><td>${l.type}</td><td>${fmtDate(l.from)} – ${fmtDate(l.to)}</td><td>${l.days}</td></tr>`; }).join('')}
        </tbody></table></div>` : ''}`;

    if (!window.Chart) return;
    Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
    charts.push(new Chart($('#ch-trend'), {
      type: 'bar',
      data: { labels: trend.map((x) => x.label), datasets: STATUSES.map((s) => ({ label: s, data: trend.map((x) => x[s]), backgroundColor: COLORS[s], borderRadius: 3, maxBarThickness: 30 })) },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { precision: 0 }, grid: { color: '#eef2f7' } } } },
    }));
    const pie = [['Present', cnt.Present], ['Late', cnt.Late], ['Half-day', cnt['Half-day']], ['Absent', cnt.Absent], ['Leave', cnt.Leave], ['Not marked', notMarked]].filter((p) => p[1] > 0);
    charts.push(new Chart($('#ch-pie'), {
      type: 'doughnut',
      data: { labels: pie.map((p) => p[0]), datasets: [{ data: pie.map((p) => p[1]), backgroundColor: pie.map((p) => COLORS[p[0]]), borderWidth: 2 }] },
      options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } } },
    }));
  }

  /* ===================== Admin: team timesheets ===================== */
  let ttDate = today();
  function viewTeam(c) {
    const t = today();
    const list = activeEmps().sort((a, b) => a.name.localeCompare(b.name));
    const cell = (r, sh) => {
      const s = r?.sessions?.find((x) => x.shift === sh.key);
      if (s) return `${s.in} – ${s.out || '<span class="live">now</span>'}${s.manual ? ' <span class="ot-tag">OT</span>' : s.auto ? ' <span class="muted small">auto</span>' : ''}`;
      if (r?.source === 'admin' && sh.key === 'morning' && r.checkIn) return `${r.checkIn} – ${r.checkOut || '—'}`;
      return '<span class="muted">—</span>';
    };
    let tot = 0; let ot = 0;
    const rows = list.map((e) => {
      const r = getAtt(e.id, ttDate);
      const live = ttDate === t && r?.sessions ? Math.round(workedSecToday(r) / 60) : r?.workMinutes || 0;
      tot += live; ot += r?.otMinutes || 0;
      return `<tr><td>${person(e.name, `${e.employeeId} · ${e.department}`)}</td><td>${cell(r, SHIFTS[0])}</td><td>${cell(r, SHIFTS[1])}</td><td class="num">${live ? hm(live) : '—'}</td><td class="num">${r?.otMinutes ? hm(r.otMinutes) : '—'}</td><td>${r?.sessions?.some((s) => !s.out) ? '<span class="badge badge-working">Working</span> ' : ''}${badge(r?.status)}</td></tr>`;
    }).join('');
    c.innerHTML = `${header('Team Timesheets', `${fmtDate(ttDate, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}${isHoliday(ttDate) ? ` · Holiday: ${esc(isHoliday(ttDate))}` : ''}`,
      `<div class="date-nav"><button class="icon-btn" data-act="tt-shift" data-n="-1">${ic('left')}</button><input type="date" id="tt-date" value="${ttDate}" max="${t}"><button class="icon-btn" data-act="tt-shift" data-n="1" ${ttDate >= t ? 'disabled' : ''}>${ic('right')}</button></div>`)}
      <div class="card flush"><div class="table-wrap"><table class="table ws-table"><thead><tr><th>Employee</th><th>Morning 09:00–13:00</th><th>Afternoon 15:00–19:00</th><th class="num">Worked</th><th class="num">OT</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td colspan="3"><strong>Total</strong></td><td class="num"><strong>${hm(tot)}</strong></td><td class="num"><strong>${hm(ot)}</strong></td><td></td></tr></tfoot></table></div></div>`;
  }

  /* ===================== Admin: employees ===================== */
  const empF = { q: '', dept: '', status: '' };
  function viewEmployees(c) {
    c.innerHTML = `${header('Employees', `${emps().length} employees in the directory`, `<button class="btn btn-primary" data-act="emp-new">${ic('plus', 'icon icon-sm')} Add Employee</button>`)}
      <div class="card"><div class="toolbar">
        <div class="input-icon grow">${ic('search', 'icon icon-sm')}<input data-empf="q" placeholder="Search by name, email, ID or designation…" value="${esc(empF.q)}"></div>
        <select data-empf="dept"><option value="">All departments</option>${departments().map((d) => `<option ${empF.dept === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>
        <select data-empf="status"><option value="">All statuses</option><option value="active" ${empF.status === 'active' ? 'selected' : ''}>Active</option><option value="inactive" ${empF.status === 'inactive' ? 'selected' : ''}>Inactive</option></select>
      </div><div id="emp-table"></div></div>`;
    renderEmpTable();
  }
  function renderEmpTable() {
    const q = empF.q.trim().toLowerCase();
    const list = emps().filter((e) => (!empF.dept || e.department === empF.dept) && (!empF.status || e.status === empF.status)
      && (!q || [e.name, e.email, e.employeeId, e.designation].some((v) => (v || '').toLowerCase().includes(q))))
      .sort((a, b) => a.name.localeCompare(b.name));
    $('#emp-table').innerHTML = list.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Emp ID</th><th>Department</th><th>Designation</th><th>Phone</th><th class="num">Monthly salary</th><th>Joined</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody>

  /* ===================== Admin: attendance register ===================== */
  let regDate = today();
  let regEdits = {};
  let regDirty = new Set();
  let regQ = '';
  const regEmps = () => activeEmps().filter((e) => !e.joinDate || e.joinDate <= regDate).sort((a, b) => a.name.localeCompare(b.name));
  function loadReg() {
    regEdits = {}; regDirty = new Set();
    regEmps().forEach((e) => {
      const r = getAtt(e.id, regDate);
      regEdits[e.id] = { status: r?.status || '', checkIn: r?.checkIn || '', checkOut: r?.checkOut || '', remarks: r?.remarks || '', live: !!r?.sessions?.some((s) => !s.out) };
    });
  }
  function viewRegister(c) {
    loadReg();
    const t = today();
    c.innerHTML = `${header('Daily Attendance Register', fmtDate(regDate, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      `<div class="date-nav"><button class="icon-btn" data-act="reg-shift" data-n="-1">${ic('left')}</button><input type="date" id="reg-date" value="${regDate}" max="${t}"><button class="icon-btn" data-act="reg-shift" data-n="1" ${regDate >= t ? 'disabled' : ''}>${ic('right')}</button></div>
       <button class="btn btn-primary" id="reg-save" data-act="reg-save" disabled>${ic('save', 'icon icon-sm')} Save</button>`)}

      <div class="card"><div class="toolbar">
        <div class="input-icon grow">${ic('search', 'icon icon-sm')}<input id="reg-q" placeholder="Filter employees…" value="${esc(regQ)}"></div>
        <button class="btn btn-ghost" data-act="reg-bulk" data-s="Present">${ic('userCheck', 'icon icon-sm')} Unmarked → Present</button>
        <button class="btn btn-ghost" data-act="reg-bulk" data-s="Absent">${ic('userX', 'icon icon-sm')} Unmarked → Absent</button>
      </div><div id="reg-table"></div>
      <p class="muted small" style="margin:12px 0 0">Times come from employee clock-ins. Editing a row here replaces the employee's shift entries with your values.</p></div>`;
    renderRegTable();
  }
  function renderRegChips() {
    const cnt = { none: 0 }; STATUSES.forEach((s) => { cnt[s] = 0; });
    Object.values(regEdits).forEach((e) => { cnt[e.status || 'none'] += 1; });
    $('#reg-chips').innerHTML = STATUSES.map((s) => `<span class="chip">${badge(s)} <strong>${cnt[s]}</strong></span>`).join('') + `<span class="chip">${badge('')} <strong>${cnt.none}</strong></span>`;
    const btn = $('#reg-save');
    btn.disabled = !regDirty.size;
    btn.innerHTML = `${ic('save', 'icon icon-sm')} Save${regDirty.size ? ` (${regDirty.size})` : ''}`;
  }
  function renderRegTable() {
    const q = regQ.trim().toLowerCase();
    const list = regEmps().filter((e) => !q || [e.name, e.employeeId, e.department].some((v) => (v || '').toLowerCase().includes(q)));
    $('#reg-table').innerHTML = list.length ? `<div class="table-wrap"><table class="table register"><thead><tr><th>Employee</th><th>Status</th><th>Check in</th><th>Check out</th><th>Remarks</th></tr></thead><tbody>
      ${list.map((e) => {
        const x = regEdits[e.id];
        const noT = !x.status || x.status === 'Absent' || x.status === 'Leave';
        return `<tr class="${regDirty.has(e.id) ? 'row-dirty' : ''}" id="row-${e.id}"><td>${person(e.name, `${e.employeeId} · ${e.department}`)}${x.live && !regDirty.has(e.id) ? '<span class="badge badge-working" style="margin-top:4px">Working now</span>' : ''}</td>
          <td><div class="status-picker">${STATUSES.map((s) => `<button type="button" class="pill pill-${cls(s)} ${x.status === s ? 'active' : ''}" data-act="reg-status" data-id="${e.id}" data-s="${s}">${s}</button>`).join('')}</div></td>
          <td><input type="time" data-reg="checkIn" data-id="${e.id}" value="${x.checkIn}" ${noT ? 'disabled' : ''}></td>
          <td><input type="time" data-reg="checkOut" data-id="${e.id}" value="${x.checkOut || ''}" ${noT ? 'disabled' : ''}></td>
          <td><input class="remarks" data-reg="remarks" data-id="${e.id}" value="${esc(x.remarks)}" placeholder="Optional"></td></tr>`;

  function regSet(id, patch) {
    Object.assign(regEdits[id], patch);

        </tbody></table></div>` : empty(`No ${leaveTabSel === 'All' ? '' : leaveTabSel.toLowerCase()} requests`)}</div>`;
