  /* ===================== Admin: reports ===================== */
  const rp = { type: 'daily', date: today(), month: today().slice(0, 7), from: `${today().slice(0, 7)}-01`, to: today(), dept: '', emp: '' };
  let report = null;
  let repView = 'details';

  function buildReport(p) {
    let from; let to; let label;
    if (p.type === 'daily') { from = to = p.date; label = `Daily Attendance Report - ${from}`; }
    else if (p.type === 'weekly') { ({ from, to } = weekRange(p.date)); label = `Weekly Attendance Report - ${from} to ${to}`; }
    else if (p.type === 'monthly') { ({ from, to } = monthRange(p.month)); label = `Monthly Attendance Report - ${p.month}`; }
    else {
      from = p.from; to = p.to;
      if (!from || !to || to < from) throw new Error('Please choose a valid date range');
      if (eachDay(from, to).length > 366) throw new Error('Range cannot exceed one year');
      label = `Attendance Report - ${from} to ${to}`;
    }
    let list = emps().filter((e) => !e.joinDate || e.joinDate <= to);
    if (p.dept) list = list.filter((e) => e.department === p.dept);
    if (p.emp) list = list.filter((e) => e.id === p.emp);
    list.sort((a, b) => a.name.localeCompare(b.name));
    const t = today();
    const wd = workingDays(from, to < t ? to : t);
    const wdSet = new Set(wd);
    const details = [];
    const summary = list.map((e) => {
      const s = { Present: 0, Late: 0, 'Half-day': 0, Absent: 0, Leave: 0, wm: 0, ot: 0, rec: 0 };
      eachDay(from, to).forEach((d) => {
        const r = getAtt(e.id, d); if (!r) return;
        s[r.status] += 1; s.wm += r.workMinutes || 0; s.ot += r.otMinutes || 0; if (wdSet.has(d)) s.rec += 1;
        details.push({ date: d, employeeId: e.employeeId, name: e.name, department: e.department || '-', status: r.status, checkIn: r.checkIn || '-', checkOut: r.checkOut || '-', workHours: hrs(r.workMinutes), otHours: hrs(r.otMinutes), remarks: r.remarks || (r.autoHalf && r.status === 'Half-day' ? 'Set automatically' : '') });
      });
      const attended = s.Present + s.Late + 0.5 * s['Half-day'];
      return { employeeId: e.employeeId, name: e.name, department: e.department || '-', present: s.Present, late: s.Late, halfDay: s['Half-day'], absent: s.Absent, leave: s.Leave,
        notMarked: Math.max(0, wd.length - s.rec), workHours: hrs(s.wm), otHours: hrs(s.ot), attendancePct: wd.length ? Math.round((attended / wd.length) * 1000) / 10 : 0 };
    });
    details.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
    const totals = { present: 0, late: 0, halfDay: 0, absent: 0, leave: 0, notMarked: 0, workHours: 0, otHours: 0 };
    summary.forEach((s) => Object.keys(totals).forEach((k) => { totals[k] = Math.round((totals[k] + s[k]) * 10) / 10; }));
    return { type: p.type, label, from, to, workingDays: wd.length, employees: list.length, summary, details, totals };
  }

  function viewReports(c) {
    const t = today();
    const dateField = (label, key, extra = '') => `<label class="field compact"><span>${label}</span><input type="date" data-rp="${key}" value="${rp[key]}" ${extra}></label>`;
    let inputs = '';
    if (rp.type === 'daily' || rp.type === 'weekly') inputs = dateField(rp.type === 'weekly' ? 'Any date in week' : 'Date', 'date', `max="${t}"`);
    if (rp.type === 'monthly') inputs = `<label class="field compact"><span>Month</span><input type="month" data-rp="month" value="${rp.month}"></label>`;
    if (rp.type === 'custom') inputs = dateField('From', 'from') + dateField('To', 'to');
    const empOpts = emps().filter((e) => !rp.dept || e.department === rp.dept).sort((a, b) => a.name.localeCompare(b.name));
    c.innerHTML = `${header('Attendance Reports', 'Generate daily, weekly and monthly reports and export them to Excel or PDF',
      `<button class="btn btn-ghost" data-act="export" data-k="excel">${ic('sheet', 'icon icon-sm')} Export Excel</button><button class="btn btn-ghost" data-act="export" data-k="pdf">${ic('file', 'icon icon-sm')} Export PDF</button>`)}
      <div class="card">
        <div class="segmented">${[['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['custom', 'Custom range']].map(([k, l]) => `<button class="${rp.type === k ? 'active' : ''}" data-act="rp-type" data-k="${k}">${l}</button>`).join('')}</div>
        <div class="toolbar wrap-row">${inputs}
          <label class="field compact"><span>Department</span><select data-rp="dept"><option value="">All departments</option>${departments().map((d) => `<option ${rp.dept === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></label>
          <label class="field compact"><span>Employee</span><select data-rp="emp"><option value="">All employees</option>${empOpts.map((e) => `<option value="${e.id}" ${rp.emp === e.id ? 'selected' : ''}>${esc(e.name)} (${e.employeeId})</option>`).join('')}</select></label>
          <button class="btn btn-primary align-end" data-act="rp-run">${ic('play', 'icon icon-sm')} Generate</button>
        </div>
      </div><div id="rep-out"></div>`;
    renderReport();
  }

  function renderReport() {
    try { report = buildReport(rp); } catch (e) { $('#rep-out').innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`; report = null; return; }
    const r = report; const t = r.totals;
    const kpi = (l, v, tone) => `<div class="kpi tone-${tone}"><strong>${v}</strong><span>${l}</span></div>`;
    $('#rep-out').innerHTML = `<div class="report-banner"><div><h3>${esc(r.label)}</h3><span class="muted small">${fmtDate(r.from)} – ${fmtDate(r.to)} · ${r.workingDays} working day(s) elapsed · ${r.employees} employee(s)</span></div>
      <div class="report-kpis">${kpi('Present', t.present, 'green')}${kpi('Late', t.late, 'amber')}${kpi('Half-day', t.halfDay, 'indigo')}${kpi('Absent', t.absent, 'red')}${kpi('Leave', t.leave, 'sky')}${kpi('OT hrs', t.otHours, 'violet')}</div></div>
      <div class="tabs"><button class="tab ${repView === 'summary' ? 'active' : ''}" data-act="rep-view" data-v="summary">Employee summary</button><button class="tab ${repView === 'details' ? 'active' : ''}" data-act="rep-view" data-v="details">Day-wise details <span class="tab-count muted-count">${r.details.length}</span></button></div>
      <div class="card">${repView === 'summary'
        ? (r.summary.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Department</th><th class="num">Present</th><th class="num">Late</th><th class="num">Half-day</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">Not marked</th><th class="num">Work hrs</th><th class="num">OT hrs</th><th>Attendance</th></tr></thead><tbody>
          ${r.summary.map((s) => `<tr><td>${person(s.name, s.employeeId)}</td><td>${esc(s.department)}</td><td class="num">${s.present}</td><td class="num">${s.late}</td><td class="num">${s.halfDay}</td><td class="num">${s.absent}</td><td class="num">${s.leave}</td><td class="num">${s.notMarked}</td><td class="num">${s.workHours}</td><td class="num">${s.otHours || '—'}</td>
            <td><div class="pct"><div class="progress"><span class="${s.attendancePct < 75 ? 'low' : ''}" style="width:${Math.min(100, s.attendancePct)}%"></span></div><span>${s.attendancePct}%</span></div></td></tr>`).join('')}
          </tbody></table></div>` : empty('No employees match these filters'))
        : (r.details.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Employee</th><th>Department</th><th>Check in</th><th>Check out</th><th class="num">Work hrs</th><th class="num">OT hrs</th><th>Status</th><th>Remarks</th></tr></thead><tbody>
          ${r.details.map((d) => `<tr><td class="nowrap">${fmtDate(d.date)} <span class="muted small">${weekday(d.date)}</span></td><td>${person(d.name, d.employeeId)}</td><td>${esc(d.department)}</td><td>${d.checkIn}</td><td>${d.checkOut}</td><td class="num">${d.workHours || '—'}</td><td class="num">${d.otHours || '—'}</td><td>${badge(d.status)}</td><td class="muted">${esc(d.remarks || '—')}</td></tr>`).join('')}
          </tbody></table></div>` : empty('No attendance records in this period'))}</div>`;
  }

  /* ---------- File export (Excel / PDF) ---------- */
  let dlPromise = null;
  async function saveFile(filename, data) {
    try {
      if (!dlPromise) dlPromise = window.claude?.use ? window.claude.use('downloads') : Promise.resolve(null);
      const dl = await dlPromise;
      if (dl) { await dl.save({ filename, data }); toast(`${filename} downloaded`); return; }
      const url = URL.createObjectURL(new Blob([data]));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(`${filename} downloaded`);
    } catch (e) {
      if (e?.code === 'declined') toast('Download cancelled', 'err');
      else toast(`Download not available here (${e?.message || e?.code || 'error'})`, 'err');
    }
  }
  const SUM_HEAD = ['Emp ID', 'Name', 'Department', 'Present', 'Late', 'Half-day', 'Absent', 'Leave', 'Not Marked', 'Work Hrs', 'OT Hrs', 'Attendance %'];
  const DET_HEAD = ['Date', 'Emp ID', 'Name', 'Department', 'Status', 'Check In', 'Check Out', 'Work Hrs', 'OT Hrs', 'Remarks'];
  const sumRow = (s) => [s.employeeId, s.name, s.department, s.present, s.late, s.halfDay, s.absent, s.leave, s.notMarked, s.workHours, s.otHours, s.attendancePct];
  const detRow = (d) => [d.date, d.employeeId, d.name, d.department, d.status, d.checkIn, d.checkOut, d.workHours, d.otHours, d.remarks];
  const fname = (r, ext) => `attendance-${r.type}-${r.from}${r.from !== r.to ? `_to_${r.to}` : ''}.${ext}`;

  async function exportExcel(r) {
    if (!window.XLSX) return toast('Excel library could not load', 'err');
    const wb = XLSX.utils.book_new();
    const meta = [[`${SETTINGS.company} - ${r.label}`], [`Period: ${r.from} to ${r.to} | Working days: ${r.workingDays} | Employees: ${r.employees} | Generated: ${new Date().toLocaleString('en-IN')}`], []];
    const t = r.totals;
    const ws1 = XLSX.utils.aoa_to_sheet([...meta, SUM_HEAD, ...r.summary.map(sumRow), ['', 'TOTAL', '', t.present, t.late, t.halfDay, t.absent, t.leave, t.notMarked, t.workHours, t.otHours, '']]);
    ws1['!cols'] = [10, 24, 18, 9, 7, 9, 8, 7, 11, 9, 8, 13].map((w) => ({ wch: w }));
    ws1['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 11 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 11 } }];
    XLSX.utils.book_append_sheet(wb, ws1, 'Summary');
    const ws2 = XLSX.utils.aoa_to_sheet([...meta, DET_HEAD, ...r.details.map(detRow)]);
    ws2['!cols'] = [12, 10, 24, 18, 10, 10, 10, 9, 8, 24].map((w) => ({ wch: w }));
    ws2['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 9 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 9 } }];
    ws2['!autofilter'] = { ref: `A4:J${4 + r.details.length}` };
    XLSX.utils.book_append_sheet(wb, ws2, 'Details');
    await saveFile(fname(r, 'xlsx'), XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
  }

  function pdfHeader(doc, title) {
    const W = doc.internal.pageSize.getWidth();
    doc.setFillColor(14, 14, 16); doc.rect(0, 0, W, 66, 'F');
    doc.setFillColor(229, 86, 75); doc.rect(0, 66, W, 3, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(SETTINGS.company, 36, 30);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(212, 212, 216); doc.text(title, 36, 50);
  }
  function pdfFooter(doc) {
    const W = doc.internal.pageSize.getWidth(); const H = doc.internal.pageSize.getHeight(); const n = doc.internal.getNumberOfPages();
    for (let i = 1; i <= n; i += 1) {
      doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(148, 163, 184);
      doc.text(`Generated ${new Date().toLocaleString('en-IN')}  |  Page ${i} of ${n}`, W - 36, H - 20, { align: 'right' });
    }
  }

  async function exportPdf(r) {
    if (!window.jspdf?.jsPDF) return toast('PDF library could not load', 'err');
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const H = doc.internal.pageSize.getHeight();
    pdfHeader(doc, r.label);
    const t = r.totals;
    doc.setTextColor(51, 65, 85); doc.setFontSize(9.5);
    doc.text(`Period: ${r.from} to ${r.to}    Working days: ${r.workingDays}    Employees: ${r.employees}    Present: ${t.present}   Late: ${t.late}   Half-day: ${t.halfDay}   Absent: ${t.absent}   Leave: ${t.leave}   OT hrs: ${t.otHours}`, 36, 90);
    doc.setTextColor(15, 23, 42); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('Employee Summary', 36, 114);
    const common = { theme: 'striped', styles: { fontSize: 8.5, cellPadding: 5 }, headStyles: { fillColor: [31, 31, 35], textColor: 255 }, margin: { left: 36, right: 36, bottom: 40 } };
    doc.autoTable({ ...common, startY: 122, head: [SUM_HEAD], body: r.summary.map((s) => { const row = sumRow(s); row[11] = `${row[11]}%`; return row; }),
      foot: [['', 'TOTAL', '', t.present, t.late, t.halfDay, t.absent, t.leave, t.notMarked, t.workHours, t.otHours, '']], footStyles: { fillColor: [226, 232, 240], textColor: 20 } });
    if (r.type !== 'monthly' || r.details.length <= 300) {
      let y = doc.lastAutoTable.finalY + 28;
      if (y > H - 100) { doc.addPage(); y = 50; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(15, 23, 42); doc.text('Attendance Details', 36, y);
      const tones = { Present: [21, 128, 61], Late: [180, 83, 9], 'Half-day': [67, 56, 202], Absent: [185, 28, 28], Leave: [3, 105, 161] };
      doc.autoTable({ ...common, startY: y + 8, head: [DET_HEAD], body: r.details.length ? r.details.map(detRow) : [['No attendance records for this period', '', '', '', '', '', '', '', '', '']],
        didParseCell: (h) => { if (h.section === 'body' && h.column.index === 4 && tones[h.cell.raw]) { h.cell.styles.textColor = tones[h.cell.raw]; h.cell.styles.fontStyle = 'bold'; } } });
    }
    pdfFooter(doc);
    await saveFile(fname(r, 'pdf'), doc.output('arraybuffer'));
  }

    doc.autoTable({ ...common, startY: doc.lastAutoTable.finalY + 18, head: [['Earnings', 'Amount', 'Deductions', 'Amount']], body,
      foot: [['Gross earnings', rs(p.gross), 'Total deductions', rs(p.totalDed)]], footStyles: { fillColor: [241, 245, 249], textColor: 20, fontStyle: 'bold' },
      columnStyles: { 1: { halign: 'right' }, 3: { halign: 'right' } } });
    const y = doc.lastAutoTable.finalY + 24;
    doc.setFillColor(253, 238, 236); doc.roundedRect(36, y, doc.internal.pageSize.getWidth() - 72, 44, 6, 6, 'F');
    doc.setTextColor(120, 30, 22); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);

  /* ===================== Admin: Employee Dashboard (HR 360° view) ===================== */
  const ED_TABS = [['overview', 'Overview'], ['attendance', 'Attendance'], ['timeoff', 'Time off'], ['payroll', 'Payroll'], ['documents', 'Documents']];
  const DOC_FOLDERS = ['Signed Documents', 'ID & Address Proofs', 'Certificates', 'Non-Disclosure Agreements', 'Uploads'];
  const LEAVE_ALLOWANCE = { vacation: 18, sick: 9 }; // days per year
  const ED_COLORS = { onTime: '#F7931E', late: '#8B3FE0', absent: '#D5CFF5' };
  let edEmpId = null;
  let edTab = 'overview';
  let edPayPage = 1;
  let edOpenFolder = null;
  let edAttMonth = today().slice(0, 7);

  const edList = () => emps().filter((e) => e.status === 'active').sort((a, b) => a.name.localeCompare(b.name));
  const edEmp = () => byId(edEmpId) || edList()[0];
  const lastMonths = (n) => {
    const out = []; const d = new Date(); d.setDate(1);
    for (let i = 0; i < n; i += 1) { out.unshift(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d.setMonth(d.getMonth() - 1); }
    return out;
  };
  const shortMonth = (ym) => new Date(`${ym}-01T00:00:00`).toLocaleDateString('en-IN', { month: 'short' });
  const docsOf = (id) => (db.docs && db.docs[id]) || [];

  function monthRates(e, ym) {
    const { from, to } = monthRange(ym);
    let on = 0; let late = 0; let absent = 0;
    eachDay(from, to < today() ? to : today()).forEach((d) => {
      const r = getAtt(e.id, d); if (!r) return;
      if (r.status === 'Present') on += 1;
      else if (r.status === 'Late' || r.status === 'Half-day') late += 1;
      else if (r.status === 'Absent') absent += 1;
    });
    const total = on + late + absent;
    const pct = (n) => (total ? Math.round((n / total) * 1000) / 10 : 0);
    return { ym, on: pct(on), late: pct(late), absent: pct(absent), total };
  }

  function leaveBalances(e) {
    const t = today(); const year = t.slice(0, 4);
    let vacUsed = 0; let sickUsed = 0; let absent = 0; let otMonth = 0; let otYear = 0;
    Object.entries(db.att).forEach(([k, r]) => {
      const [id, d] = k.split('|');
      if (id !== e.id || !d.startsWith(year) || d > t) return;
      if (r.status === 'Leave') { if (/sick/i.test(r.remarks || '')) sickUsed += 1; else vacUsed += 1; }
      if (r.status === 'Absent') absent += 1;
      otYear += r.otMinutes || 0;
      if (d.startsWith(t.slice(0, 7))) otMonth += r.otMinutes || 0;
    });
    let vacSched = 0; let sickSched = 0;
    db.leaves.filter((l) => l.empId === e.id && ['Approved', 'Pending'].includes(l.status) && l.to > t).forEach((l) => {
      const days = workingDays(l.from > t ? l.from : addDays(t, 1), l.to).length;
      if (l.type === 'Sick') sickSched += days; else vacSched += days;
    });
    return {
      vacation: Math.max(0, LEAVE_ALLOWANCE.vacation - vacUsed) * 8, vacSched: vacSched * 8, vacUsed,
      sick: Math.max(0, LEAVE_ALLOWANCE.sick - sickUsed) * 8, sickSched: sickSched * 8, sickUsed,
      absent, otMonth, otYear,
    };
  }

  function payrollRows(e) {
    const cur = today().slice(0, 7);
    const join = (e.joinDate || '2000-01').slice(0, 7);
    return lastMonths(24).filter((ym) => ym >= join).reverse().map((ym, i) => {
      const p = payslip(e, ym);
      const { to } = monthRange(ym);
      return { n: i + 1, ym, label: `${monthLabel(ym)} salary`, date: ym === cur ? '—' : fmtDate(to), amount: p.net, status: ym === cur ? 'Pending' : 'Paid' };
    });
  }

  const edPill = (s) => `<span class="ed-status ${s === 'Paid' ? 'paid' : 'pending'}">${s}</span>`;

  function edPayrollTable(e, perPage = 5) {
    const rows = payrollRows(e);
    const pages = Math.max(1, Math.ceil(rows.length / perPage));
    if (edPayPage > pages) edPayPage = pages;
    const view = rows.slice((edPayPage - 1) * perPage, edPayPage * perPage);
    const nums = [];
    for (let i = 1; i <= pages; i += 1) {
      if (i === 1 || i === pages || Math.abs(i - edPayPage) <= 1) nums.push(i);
      else if (nums[nums.length - 1] !== '…') nums.push('…');
    }
    return `<div class="ed-sec-head"><h3>Recent Payroll</h3>
        <div class="ed-pager">${nums.map((n) => (n === '…' ? '<span>…</span>' : `<button class="${n === edPayPage ? 'on' : ''}" data-act="ed-page" data-p="${n}">${n}</button>`)).join('')}
          <button data-act="ed-page" data-p="${Math.min(pages, edPayPage + 1)}" ${edPayPage >= pages ? 'disabled' : ''}>Next ${ic('right', 'icon icon-xs')}</button></div></div>
      <div class="ed-table-wrap"><table class="ed-table"><thead><tr><th>№</th><th>Pay period</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>
        ${view.length ? view.map((r) => `<tr><td>${r.n}</td><td>${r.label}</td><td>${r.date}</td><td>${money(r.amount)}</td><td><button class="ed-pill-btn" data-act="ed-slip" data-ym="${r.ym}">${edPill(r.status)}</button></td></tr>`).join('') : '<tr><td colspan="5" class="muted">No payroll yet</td></tr>'}
      </tbody></table></div>`;
  }

  function edDocsPanel(e, full = false) {
    const docs = docsOf(e.id);
    const paid = payrollRows(e).filter((r) => r.status === 'Paid').length;
    const folders = [...DOC_FOLDERS.map((f) => [f, docs.filter((d) => d.folder === f)]), ['Payslips', null]];
    return `<div class="ed-docs ${full ? 'full' : ''}"><h3>Documents</h3><ul>
      ${folders.filter(([f, list]) => f !== 'Uploads' || (list && list.length)).map(([f, list]) => {
        const count = list ? list.length : paid;
        const open = edOpenFolder === f || full;
        return `<li><button class="ed-folder" data-act="ed-folder" data-f="${esc(f)}">${ic(open ? 'folderOpen' : 'folder', 'icon icon-sm')}<span>${esc(f)}</span><em>${count}</em></button>
          ${open ? `<div class="ed-files">${list ? (list.length ? list.map((d) => `<div>${ic('file', 'icon icon-xs')}<span class="ed-fname">${esc(d.name)}</span>${full ? `<span class="muted small">${d.date ? fmtDate(d.date) : ''}</span>` : ''}</div>`).join('') : '<div class="muted small">No files</div>')
            : `<div class="muted small">${paid} monthly salary slips. Open them from Payroll.</div>`}</div>` : ''}</li>`;
      }).join('')}</ul>
      <button class="ed-upload" data-act="ed-upload">${ic('upload', 'icon icon-sm')} Upload</button></div>`;
  }

  function edTiles(e) {
    const b = leaveBalances(e);
    return `<div class="ed-tiles">
      <div class="ed-tile t-orange">${ic('palm', 'ed-tile-art')}<span>Vacation</span><strong>${b.vacation} h</strong><small>${b.vacSched} hours scheduled</small></div>
      <div class="ed-tile t-purple">${ic('virus', 'ed-tile-art')}<span>Sick days</span><strong>${b.sick} h</strong><small>${b.sickSched} hours scheduled</small></div>
      <div class="ed-tile t-grey">${ic('clock', 'ed-tile-art')}<span>Overtime</span><strong>${hrs(b.otMonth)} h</strong><small>this month · ${hrs(b.otYear)} h this year</small></div>
      <div class="ed-tile t-black">${ic('x', 'ed-tile-art')}<span>Absences</span><strong>${b.absent} d</strong><small>this year</small></div>
    </div>`;
  }

  function viewEmployeeDashboard(c) {
    const list = edList();
    if (!list.length) { c.innerHTML = `${header('Employees')}${empty('No active employees')}`; return; }
    const e = edEmp(); edEmpId = e.id;
    c.innerHTML = `<div class="ed">
      <div class="ed-top">
        <a href="#employees" class="ed-back">${ic('left')} <h1>Employees</h1></a>
        <div class="input-icon ed-search">${ic('search', 'icon icon-sm')}<input list="ed-emps" id="ed-search" placeholder="Search employee…"><datalist id="ed-emps">${list.map((x) => `<option value="${esc(x.name)} · ${esc(x.employeeId)}">`).join('')}</datalist></div>
      </div>
      <div class="ed-tabs">${ED_TABS.map(([k, l]) => `<button class="${edTab === k ? 'on' : ''}" data-act="ed-tab" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="ed-grid">
        <div class="ed-main">
          <div class="ed-person">
            <span class="ed-avatar">${esc(initials(e.name))}</span>
            <div class="ed-person-text"><h2>${esc(e.name)}</h2><span>${esc(e.designation || '')} · ${esc(e.department || '')}</span></div>
            <div class="ed-person-actions"><button class="ed-btn-outline" data-act="ed-info">Info</button><button class="ed-btn-solid" data-act="ed-next">Next employee ${ic('right', 'icon icon-xs')}</button></div>
          </div>
          <div id="ed-body"></div>
        </div>
        <aside class="ed-side">${edDocsPanel(e)}${edTiles(e)}</aside>
      </div></div>`;
    renderEdBody(e);
  }

  function renderEdBody(e) {
    charts.forEach((ch) => ch.destroy()); charts = [];
    const el = $('#ed-body');
    if (edTab === 'overview') {
      el.innerHTML = `<div class="ed-sec-head"><h3>Attendance Rate</h3><div class="ed-legend"><i style="background:${ED_COLORS.onTime}"></i>On time<i style="background:${ED_COLORS.late}"></i>Late<i style="background:${ED_COLORS.absent}"></i>Absent</div></div>
        <div class="ed-chart"><canvas id="ed-rate"></canvas></div>${edPayrollTable(e)}`;
      drawRate(e);
    } else if (edTab === 'attendance') {
      const { from, to } = monthRange(edAttMonth);
      const rows = eachDay(from, to).reverse().map((d) => ({ d, r: getAtt(e.id, d) })).filter((x) => x.r || isHoliday(x.d));
      const rates = monthRates(e, edAttMonth);
      el.innerHTML = `<div class="ed-sec-head"><h3>Attendance · ${monthLabel(edAttMonth)}</h3><input type="month" id="ed-month" value="${edAttMonth}" max="${today().slice(0, 7)}"></div>
        <div class="ed-mini-kpis"><div><strong>${rates.on}%</strong><span>On time</span></div><div><strong>${rates.late}%</strong><span>Late / half day</span></div><div><strong>${rates.absent}%</strong><span>Absent</span></div><div><strong>${rates.total}</strong><span>Days recorded</span></div></div>
        <div class="ed-table-wrap"><table class="ed-table"><thead><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>
        ${rows.length ? rows.map(({ d, r }) => (r ? `<tr><td>${fmtDate(d)} <span class="muted small">${weekday(d)}</span></td><td>${badge(r.status)}</td><td>${r.checkIn || '—'}</td><td>${r.checkOut || '—'}</td><td>${hrs(r.workMinutes)}${r.otMinutes ? ` <span class="ot-tag">+${hrs(r.otMinutes)} OT</span>` : ''}</td></tr>`
          : `<tr><td>${fmtDate(d)}</td><td><span class="badge badge-holiday">Holiday</span></td><td colspan="3" class="muted">${esc(isHoliday(d))}</td></tr>`)).join('') : '<tr><td colspan="5" class="muted">No attendance this month</td></tr>'}
        </tbody></table></div>`;
    } else if (edTab === 'timeoff') {
      const b = leaveBalances(e);
      const items = db.leaves.filter((l) => l.empId === e.id).sort((a, x) => x.createdAt - a.createdAt);
      el.innerHTML = `<div class="ed-sec-head"><h3>Time off · ${today().slice(0, 4)}</h3></div>
        <div class="ed-mini-kpis"><div><strong>${b.vacUsed} / ${LEAVE_ALLOWANCE.vacation}</strong><span>Vacation days used</span></div><div><strong>${b.sickUsed} / ${LEAVE_ALLOWANCE.sick}</strong><span>Sick days used</span></div><div><strong>${(b.vacSched + b.sickSched) / 8}</strong><span>Days scheduled</span></div><div><strong>${b.absent}</strong><span>Absences</span></div></div>
        <div class="ed-table-wrap"><table class="ed-table"><thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr></thead><tbody>
        ${items.length ? items.map((l) => `<tr><td>${l.type}</td><td>${fmtDate(l.from)}</td><td>${fmtDate(l.to)}</td><td>${l.days}</td><td class="wrap">${esc(l.reason)}</td><td>${leaveBadge(l.status)}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">No leave requests</td></tr>'}
        </tbody></table></div>`;
    } else if (edTab === 'payroll') {
      el.innerHTML = `${edPayrollTable(e, 10)}<p class="muted small" style="margin-top:10px">Click a status to view that month's salary slip. Monthly salary: ${money(e.salary || 0)}.</p>`;
    } else if (edTab === 'documents') {
      el.innerHTML = edDocsPanel(e, true);
    }
  }

  function drawRate(e) {
    const data = lastMonths(12).map((ym) => monthRates(e, ym));
    if (!window.Chart) { $('#ed-rate').parentElement.innerHTML = '<div class="muted small">Chart library could not load.</div>'; return; }
    charts.push(new Chart($('#ed-rate'), {
      type: 'bar',
      data: {
        labels: data.map((d) => shortMonth(d.ym)),
        datasets: [
          { label: 'On time', data: data.map((d) => d.on), backgroundColor: ED_COLORS.onTime },
          { label: 'Late', data: data.map((d) => d.late), backgroundColor: ED_COLORS.late },
          { label: 'Absent', data: data.map((d) => d.absent), backgroundColor: ED_COLORS.absent },
        ].map((ds) => ({ ...ds, borderRadius: 6, borderSkipped: false, maxBarThickness: 26, borderColor: '#fff', borderWidth: { top: 2 } })),
      },
      options: {
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#fff', titleColor: '#111', bodyColor: '#555', borderColor: '#ececf2', borderWidth: 1, padding: 10,
            usePointStyle: true, boxWidth: 8, boxHeight: 8,
            callbacks: { label: (ctx) => ` ${ctx.parsed.y}%  ${ctx.dataset.label}`, afterBody: (items) => (data[items[0].dataIndex].total ? '' : 'No attendance recorded') },
          },
        },
        scales: {
          x: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { color: '#555', font: { size: 11 } } },
          y: { stacked: true, max: 100, ticks: { stepSize: 20, callback: (v) => `${v} %`, color: '#555', font: { size: 11 } }, grid: { display: false }, border: { display: false } },
        },
      },
    }));
  }

  /* ===================== Attendance Kiosk: every person registers individually ===================== */

  /* ===================== Clock & OT operations (shared by workspace and kiosk) ===================== */
  function opClockIn(u) {
    const t = today(); const k = `${u.id}|${t}`;
    const ph = dayPhase(u, db.att[k]);
    if (ph.phase !== 'clockable') throw new Error('Clock in is not open right now');
    if (!db.att[k]?.sessions) db.att[k] = { sessions: [], source: 'self', remarks: '' };
    const inT = nowHH(); let extra = '';
    const ot = db.att[k].sessions.find((s) => !isReg(s) && !s.out);
    if (ot) { ot.out = inT; extra = ' · overtime stopped'; }
    db.att[k].sessions.push({ shift: ph.shift.key, in: inT, out: null });
    syncRec(db.att[k], t); persist();
    return `Clocked in at ${inT} for the ${ph.shift.label.toLowerCase()} shift${db.att[k].status === 'Late' ? ' (late)' : ''}${extra}`;
  }
  function opClockOut(u) {
    const t = today(); const rec = getAtt(u.id, t);
    const s = rec?.sessions?.find((x) => isReg(x) && !x.out);
    if (!s) throw new Error('You are not clocked in to a shift');
    s.out = nowHH(); if (toMin(s.out) < toMin(s.in)) s.out = s.in;
    syncRec(rec, t); persist();
    return `Clocked out at ${s.out}`;
  }
  function otStartBlocker(u) {
    const t = today(); const rec = getAtt(u.id, t);
    if (rec && rec.source === 'admin' && !rec.sessions) return 'Attendance for today was already recorded by HR';
    const ses = rec?.sessions || [];
    if (ses.some((s) => !isReg(s) && !s.out)) return 'Overtime is already running';
    if (ses.some((s) => isReg(s) && !s.out)) return 'You are on a shift right now. Clock out first, or use “Record out time”';
    const dayOff = isOff(t) || rec?.status === 'Leave' || approvedLeaveOn(u.id, t);
    const sh = inShiftHours(nowMinF());
    if (sh && !dayOff) return `Overtime can be started outside shift hours (now inside the ${sh.label.toLowerCase()} shift ${sh.start}–${sh.end})`;
    return null;
  }
  function opOtStart(u) {
    const err = otStartBlocker(u); if (err) throw new Error(err);
    const t = today(); const k = `${u.id}|${t}`;
    if (!db.att[k]) db.att[k] = { sessions: [], source: 'self', remarks: '' };
    if (!db.att[k].sessions) db.att[k].sessions = [];
    const inT = nowHH();
    db.att[k].sessions.push({ shift: 'ot', in: inT, out: null });
    syncRec(db.att[k], t); persist();
    return `Overtime started at ${inT}`;
  }
  function opOtStop(u) {
    const t = today(); const rec = getAtt(u.id, t);
    const s = rec?.sessions?.find((x) => !isReg(x) && !x.out);
    if (!s) throw new Error('No overtime is running');
    s.out = nowHH(); if (toMin(s.out) < toMin(s.in)) s.out = s.in;
    syncRec(rec, t); persist();
    return `Overtime stopped at ${s.out} · ${hm(workMin(s.in, s.out)) === '—' ? '0h 00m' : hm(workMin(s.in, s.out))} recorded`;
  }
  const workMin = (i, o) => Math.max(0, toMin(o) - toMin(i));
  function runOp(fn, u, after) {
    try { const msg = fn(u); after?.(); toast(msg); } catch (e) { toast(e.message, 'err'); }
  }

  /* ===================== OT menu: start overtime or record out time ===================== */

  /* ===================== OT (Out Time) ===================== */
  function openOT() {
    const u = me(); const t = today(); const rec = getAtt(u.id, t);
    const s = rec?.sessions?.find((x) => isReg(x) && !x.out) || lastSession(rec);

    'rp-run': () => { renderReport(); toast('Report generated'); },
    'rep-view': (el) => { repView = el.dataset.v; renderReport(); },
    export: (el) => { if (!report) return toast('Generate a report first', 'err'); (el.dataset.k === 'excel' ? exportExcel : exportPdf)(report); },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.empf) { empF[el.dataset.empf] = el.value; renderEmpTable(); }
    if (el.id === 'reg-q') { regQ = el.value; renderRegTable(); }
    if (el.id === 'k-q') { kioskQ = el.value; renderKioskGrid(); }
    if (el.id === 'k-pin') { el.value = el.value.replace(/\D/g, '').slice(0, 4); kioskDots(); if (el.value.length === 4) el.form.requestSubmit(); }
    if (el.dataset.reg) {
      regEdits[el.dataset.id][el.dataset.reg] = el.value; regDirty.add(el.dataset.id);
      $(`#row-${el.dataset.id}`)?.classList.add('row-dirty'); renderRegChips();
    }
    if (el.name === 'out' && el.closest('[data-form="ot"]')) updateOtPreview();
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'reg-date' && el.value && el.value <= today()) { regDate = el.value; render(); }
    if (el.id === 'tt-date' && el.value && el.value <= today()) { ttDate = el.value; render(); }
    if (el.id === 'demo-emp' && el.value) {
      const u = byId(el.value); const f = document.querySelector('[data-form="login"]');
      f.email.value = u.email; f.password.value = u.password;
    }
    if (el.id === 'ed-month' && el.value) { edAttMonth = el.value; renderEdBody(edEmp()); }
    if (el.id === 'ed-search' && el.value) {
      const hit = edList().find((x) => el.value.includes(x.employeeId) || x.name.toLowerCase() === el.value.toLowerCase());
      if (hit) { edEmpId = hit.id; edPayPage = 1; viewEmployeeDashboard($('#content')); } else toast('No matching employee', 'err');
    }
    if (el.id === 'pay-month') { wsPayMonth = el.value; renderWsTab(me()); }
    if (el.id === 'sim-time') {
      if (el.value) {
        if (!sim) simSnapshot = JSON.stringify(db);
        sim = { real: Date.now(), sec: toMin(el.value) * 60, label: el.value };
        toast(`Demo clock set to ${el.value}. Changes are temporary`);
      } else { endSim(); toast('Back to real time. Demo changes discarded'); }
      syncToday(); viewWorkspace($('#content'), me());
    }
    if (el.dataset.rp) {
      rp[el.dataset.rp] = el.value;
      if (el.dataset.rp === 'dept') { rp.emp = ''; viewReports($('#content')); }
    }
  });

  const FORMS = {
    login: (f) => {
      const email = f.email.value.trim().toLowerCase(); const pw = f.password.value;
      const u = db.users.find((x) => x.email === email);
      if (!email || !pw) { $('#login-err').innerHTML = '<div class="alert alert-error">Email and password are required</div>'; return; }
      if (!u || u.password !== pw) { $('#login-err').innerHTML = '<div class="alert alert-error">Invalid email or password</div>'; return; }
      if (u.status !== 'active') { $('#login-err').innerHTML = '<div class="alert alert-error">Your account is inactive. Contact the administrator.</div>'; return; }
      db.session = u.id; persist();
      try { history.replaceState(null, '', `#${u.role === 'admin' ? 'dashboard' : 'workspace'}`); } catch { /* ignore */ }
      render(); toast(`Welcome back, ${u.name.split(' ')[0]}!`);
    },
    employee: (f) => {
      const id = f.dataset.id; const d = Object.fromEntries(new FormData(f));
      Object.keys(d).forEach((k) => { d[k] = String(d[k]).trim(); });
      d.employeeId = d.employeeId.toUpperCase(); d.email = d.email.toLowerCase(); d.salary = Number(d.salary) || 0;
      if (!d.name || !d.employeeId || !d.email) return toast('Name, Employee ID and Email are required', 'err');
      if (!/^\S+@\S+\.\S+$/.test(d.email)) return toast('Please enter a valid email', 'err');
      if (db.users.some((u) => u.id !== id && u.email === d.email)) return toast('A user with this email already exists', 'err');
      if (db.users.some((u) => u.id !== id && u.employeeId === d.employeeId)) return toast('This Employee ID is already used', 'err');
      if (!id && d.password.length < 8) return toast('Password must be at least 8 characters', 'err');
      if (id && d.password && d.password.length < 8) return toast('Password must be at least 8 characters', 'err');
      if (d.pin && !/^\d{4}$/.test(d.pin)) return toast('Kiosk PIN must be 4 digits', 'err');
      if (!d.pin) delete d.pin;
      if (!d.password) delete d.password;
      if (id) Object.assign(byId(id), d);
      else db.users.push({ id: uid(), role: 'employee', ...d });
      persist(); closeModal(); render(); toast(id ? 'Employee updated' : 'Employee added');
    },
    leave: (f) => {
      const u = me(); const d = Object.fromEntries(new FormData(f));
      if (!d.from || !d.to || d.to < d.from) return toast('End date cannot be before start date', 'err');
      if (!d.reason.trim()) return toast('Please provide a reason', 'err');
      const days = workingDays(d.from, d.to).length;
      if (!days) return toast('Selected range has no working days', 'err');
      if (db.leaves.some((l) => l.empId === u.id && ['Pending', 'Approved'].includes(l.status) && l.from <= d.to && l.to >= d.from)) return toast('You already have a request overlapping these dates', 'err');
      db.leaves.push({ id: uid(), empId: u.id, type: d.type, from: d.from, to: d.to, days, reason: d.reason.trim(), status: 'Pending', comment: '', createdAt: Date.now(), reviewedBy: '' });
      persist(); closeModal(); wsTab = 'leave'; render(); toast('Leave request submitted');
    },
    ot: (f) => {
      const u = me(); const t = today(); const rec = getAtt(u.id, t);
      const s = rec?.sessions?.find((x) => x.shift === f.dataset.shift);
      if (!s) return;
      const out = f.out.value;
      if (!out) return toast('Please enter an out time', 'err');
      if (toMin(out) <= toMin(s.in)) return toast(`Out time must be after your clock-in (${s.in})`, 'err');
      if (toMin(out) > Math.floor(nowMinF())) return toast(`Out time can't be in the future (now ${nowHH()})`, 'err');
      const nextS = rec.sessions.find((x) => toMin(x.in) > toMin(s.in));
      if (nextS && toMin(out) > toMin(nextS.in)) return toast(`Out time overlaps your ${nextS.shift} clock-in (${nextS.in})`, 'err');
      Object.assign(s, { out, manual: true, auto: false, reason: f.reason.value, note: f.note.value.trim() });
      syncRec(rec, t); persist(); closeModal(); viewWorkspace($('#content'), u);
      const ot = Math.max(0, toMin(out) - toMin(shiftOf(s.shift).end));
      toast(ot ? `Out time ${out} saved · +${hm(ot)} overtime` : `Out time ${out} saved`);
    },
    'kiosk-pin': (f) => {
      const u = byId(f.dataset.id); const pin = f.pin.value;
      if (pin !== (u.pin || '1234')) { $('#k-err').textContent = 'Wrong PIN, please try again'; f.pin.value = ''; kioskDots(); f.pin.focus(); return; }
      kioskActions(u);
    },
    'ed-upload': (f) => {
      const file = f.file.files[0]; if (!file) return toast('Choose a file', 'err');
      const e = edEmp(); db.docs = db.docs || {}; db.docs[e.id] = db.docs[e.id] || [];
      db.docs[e.id].push({ folder: f.folder.value, name: file.name, date: today() });
      edOpenFolder = f.folder.value; persist(); closeModal(); viewEmployeeDashboard($('#content')); toast(`${file.name} uploaded to ${f.folder.value}`);
    },
    password: (f) => {
      const u = me();
      if (f.cur.value !== u.password) return toast('Current password is incorrect', 'err');
      if (f.nw.value.length < 8) return toast('New password must be at least 8 characters', 'err');
      if (f.nw.value !== f.cf.value) return toast('New passwords do not match', 'err');
      u.password = f.nw.value; persist(); f.reset(); toast('Password updated successfully');
    },
  };
  document.addEventListener('submit', (e) => {
    const f = e.target; const fn = FORMS[f.dataset.form];
    e.preventDefault();
    if (fn) fn(f);
  });

  render();
})();

</script>
</body>
</html>
